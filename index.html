<html lang="pt-BR">
<head>
<title>Cofre Pessoal</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:title" content="Cofre Pessoal">
<meta property="og:description" content="Organize seu dinheiro: gastos, contas a pagar, parcelas, metas e orçamento em um só lugar. Seus dados são privados.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cofre-pessoal.onrender.com/icon-512.png">
<link rel="manifest" href="manifest.json">
<script>(function(){var t="dark";try{t=localStorage.getItem("cofre-tema")||"dark"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cofre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cockpit financeiro — trilho de navegação à esquerda (barra inferior no celular), painel em grade com telemetria em fonte mono */
:root{
  --bg:#070b14; --panel:#0e1524; --panel2:#131c30; --line:#1f2b45; --fg:#e6edf8; --muted:#8393b0;
  --accent:#38e1ff; --accent2:#8f7bff; --good:#3ddc97; --warn:#ffb547; --bad:#ff5d73;
  --glow:rgba(56,225,255,.18); --grid:rgba(56,225,255,.045);
  --f-display:"Chakra Petch",system-ui,sans-serif; --f-body:"Manrope",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef3fa; --panel:#ffffff; --panel2:#f4f7fc; --line:#d6dfee; --fg:#0d1628; --muted:#5a6a86;
  --accent:#0090c7; --accent2:#5b46e6; --good:#0c9d63; --warn:#c47a00; --bad:#d6334b;
  --glow:rgba(0,144,199,.14); --grid:rgba(0,120,180,.06); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef3fa; --panel:#ffffff; --panel2:#f4f7fc; --line:#d6dfee; --fg:#0d1628; --muted:#5a6a86;
  --accent:#0090c7; --accent2:#5b46e6; --good:#0c9d63; --warn:#c47a00; --bad:#d6334b;
  --glow:rgba(0,144,199,.14); --grid:rgba(0,120,180,.06); color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(8px);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand i{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));box-shadow:0 0 18px var(--glow);display:block}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:400}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:600}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn:hover{color:var(--fg);background:var(--panel2)}
.navbtn[aria-current="true"]{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent)}
.navbtn[aria-current="true"] svg{color:var(--accent)}
.rail .foot{margin-top:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:8px}
.sync{display:inline-flex;align-items:center;gap:6px}.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok b{background:var(--good);box-shadow:0 0 8px var(--good)}.sync.busy b{background:var(--warn)}
main{padding-block:26px 90px;padding-inline:clamp(16px,3vw,36px);min-width:0;max-width:1240px;width:100%}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
h1{font-family:var(--f-display);font-size:clamp(24px,3.2vw,34px);margin:0;letter-spacing:.02em;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--f-display);font-size:17px;margin:0;letter-spacing:.03em}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101c;border:0;box-shadow:0 6px 24px var(--glow)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 55%),radial-gradient(90% 120% at 100% 100%,color-mix(in srgb,var(--accent2) 16%,transparent),transparent 60%),var(--panel)}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1.05;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.hero-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.kpi .lb{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .vl{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}.wrn{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.row .ic.in{color:var(--good)}.row .ic.out{color:var(--bad)}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted)}
.row .v{font-family:var(--f-mono);font-weight:600;text-align:right;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--glow)}
.catrow{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.catrow .mono{text-align:right}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);margin-bottom:18px;font-size:14px}
.insight{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.insight:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .nm{font-weight:700;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stats .lb{font-size:10.5px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats .vl{font-family:var(--f-mono);font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.ticks{display:flex;gap:3px;flex-wrap:wrap}
.ticks i{width:12px;height:12px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.ticks i.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--glow)}
.ticks i.now{background:var(--accent2);border-color:var(--accent2)}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);width:100%;min-width:0}
label.f input:focus,label.f select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--glow)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px;border:0;background:var(--panel2);cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"].in{background:color-mix(in srgb,var(--good) 20%,var(--panel2));color:var(--good)}
.seg button[aria-pressed="true"].out{background:color-mix(in srgb,var(--bad) 20%,var(--panel2));color:var(--bad)}
.seg button[aria-pressed="true"].n{background:color-mix(in srgb,var(--accent) 20%,var(--panel2));color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(3,6,14,.62);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.sheet .box{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sheet .box .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.out-box{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.out-box .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.verdict{padding:14px 16px;border-radius:12px;border:1px solid var(--line);margin-top:14px;font-size:14.5px}
.verdict.good{border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
.verdict.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.verdict.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.tip{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px;height:34px;display:grid;place-items:center}
.tip h3{margin:0 0 4px;font-size:15.5px}
.tip p{margin:0;color:var(--muted);font-size:14px;max-width:68ch}
.brow{display:grid;grid-template-columns:minmax(0,1.1fr) 78px minmax(0,1.4fr);gap:16px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}
.brow:last-of-type{border-bottom:0}
.brow .t{font-weight:700}.brow .s{font-size:12.5px;color:var(--muted)}
.pct{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);color:var(--muted)}
.pct input{width:56px;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);text-align:right;font-family:var(--f-mono)}
.pct input:focus{border-color:var(--accent);outline:none}
.bbar{position:relative;height:12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.bbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bbar b{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--bad) 0 6px,color-mix(in srgb,var(--bad) 55%,transparent) 6px 12px)}
.bbar.good i{background:var(--good);box-shadow:0 0 10px color-mix(in srgb,var(--good) 50%,transparent)}
.bbar.warn i{background:var(--warn)}
.bbar.bad i{background:var(--bad)}
.bnums{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
@media (max-width:760px){.brow{grid-template-columns:minmax(0,1fr) auto}.brow .bcol{grid-column:1/-1}}
.billd summary{list-style:none;cursor:pointer}.billd summary::-webkit-details-marker{display:none}
.billd[open] summary{border-bottom-style:dashed}
.billd .items{padding:6px 4px 12px 50px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;border-bottom:1px solid var(--line)}
.billd .items div{display:flex;justify-content:space-between;gap:10px}
.row .ic svg{width:18px;height:18px}
.chartwrap{width:100%;overflow-x:auto}
body.locked nav.rail,body.locked .mobilenav{display:none}
body.locked .app{grid-template-columns:1fr}
body.locked main{max-width:none}
.login{min-height:calc(100vh - 120px);display:grid;place-items:center}
.lbox{width:min(420px,100%);padding:28px}
.who{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;background:var(--panel2)}
.who img{width:44px;height:44px;border-radius:50%;flex:none}
.acct{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13.5px;font-weight:600}
.acct img{width:26px;height:26px;border-radius:50%}
.terms{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:14px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dzrow{display:grid;grid-template-columns:minmax(0,1.4fr) 120px 120px minmax(150px,auto);gap:14px;align-items:end;padding:14px 2px;border-bottom:1px solid var(--line)}
.dzrow:last-child{border-bottom:0}
.dzrow .t{font-weight:700}.dzrow .s{font-size:12.5px;color:var(--muted)}
.dzrow.off{opacity:.55}
.dzrow input:disabled{opacity:.6}
.dzact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;padding-bottom:4px}
@media (max-width:760px){.dzrow{grid-template-columns:1fr 1fr}.dzrow>div:first-child,.dzrow .dzact{grid-column:1/-1}.dzrow .dzact{justify-content:flex-start}}
.lesson .n{font-size:12px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px;height:34px;min-width:44px;display:grid;place-items:center}
.lesson.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.autherr{min-height:1.2em;margin:12px 0 0;font-size:13.5px;color:var(--bad)}
.autherr.ok{color:var(--good)}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#04101c;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.updpill{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;color:#04101c;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 30px var(--glow);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-2px);box-shadow:0 12px 36px var(--glow)}}
@media (prefers-reduced-motion:reduce){.updpill{animation:none}}
@media (max-width:760px){.updpill{bottom:calc(78px + env(safe-area-inset-bottom,0px))}}
.newsl{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.navbtn.guide{color:var(--fg);border-color:color-mix(in srgb,var(--accent2) 55%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent2) 22%,transparent),color-mix(in srgb,var(--accent) 10%,transparent));text-decoration:none;margin-bottom:8px}
.navbtn.guide svg{color:var(--accent2)}
.guidebtn{border-color:var(--accent2);color:var(--fg);background:color-mix(in srgb,var(--accent2) 18%,var(--panel2))}
.guidecard{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px;border-color:color-mix(in srgb,var(--accent2) 50%,var(--line));background:linear-gradient(110deg,color-mix(in srgb,var(--accent2) 16%,var(--panel)),var(--panel) 70%)}
.guidecard h2{font-size:20px}
.gc-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101c;flex:none}
.gc-ic svg{width:26px;height:26px}
.gc-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){.mobilenav .navbtn.guide{margin-bottom:0}}
.ukpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
.ukpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ukpi .lb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* entradas do mês com dia: recebida (dia já passou ou marcou "Recebi") ou prevista */
function receipts(m){
 const out=[],td=TODAY.getDate(),g=S.got||{};
 S.rec.filter(r=>r.type==='in'&&recActive(r,m)).forEach(r=>out.push({key:m+':rin:'+r.id,kind:'Entrada fixa',name:r.desc,from:r.from||'',day:r.day||1,val:num(r.val),rec:1}));
 (S.instIn||[]).filter(i=>inInMonth(i,m)).forEach(i=>out.push({key:m+':ini:'+i.id,kind:'Entrada parcelada '+(diffM(i.first,m)+1)+'/'+i.n,name:i.desc,from:i.from||'',day:i.day||10,val:inParcel(i)}));
 extraIn(m).forEach(r=>out.push(r));
 S.tx.filter(t=>t.type==='in'&&t.date&&t.date.slice(0,7)===m).forEach(t=>out.push({key:'tx:'+t.id,kind:'Entrada avulsa',name:t.desc,from:'',day:+t.date.slice(8,10)||1,val:num(t.val),tx:true}));
 out.forEach(r=>{const d=diffM(m,CUR);r.settled=isSettled(m,r.day,!!(r.rec||(r.work&&r.key.indexOf(':acd:')<0)));r.auto=d>0||(d===0&&r.day<=td);r.got=r.settled||(g[r.key]!=null?!!g[r.key]:r.auto)});
 return out.sort((a,b)=>a.day-b.day);
}
function isSettled(m,day,recurring){ // já está dentro do saldo informado (início do uso do app)
 const i=S.initial;if(!i||!i.month)return false;const d=diffM(i.month,m);
 if(d<0)return true;if(d>0)return false;
 if(num(day)<=num(i.day))return true;
 return !!(recurring&&i.settled);
}
function iniDay(m){const i=S.initial;return i&&i.month===m?num(i.day):0} // itens até esse dia já estão dentro do saldo informado
function outItems(m){ // tudo que sai do caixa no mês m, item a item (bate com month().saidas)
 const L=bills(m).map(b=>({name:b.name,kind:b.kind,day:b.day,val:b.val,done:!!b.paid,settled:b.settled}));
 S.tx.filter(t=>t.type==='out'&&t.date&&!cardById(t.cardId)&&t.date.slice(0,7)===m).forEach(t=>{const dd=+t.date.slice(8,10)||1;L.push({name:t.desc,kind:'Gasto lançado',day:dd,val:num(t.val),done:true,settled:isSettled(m,dd,false)})});
 extraOut(m).forEach(r=>L.push({name:r.name,kind:r.kind,day:r.day,settled:isSettled(m,r.day,false),val:r.val,done:diffM(m,CUR)>0||(m===CUR&&r.day<=TODAY.getDate())}));
 return L;
}
function pendingIn(m){const d=iniDay(m);return receipts(m).filter(r=>!r.got&&r.day>d).reduce((a,r)=>a+r.val,0)}
function pendingOut(m){const d=iniDay(m);return bills(m).filter(b=>!b.paid&&b.day>d).reduce((a,b)=>a+b.val,0)} // contas/faturas do mês ainda não pagas
function varRestOf(){const i=S.initial;let base=Math.max(0,avgVarOut()-month(CUR).outDia);if(i&&i.month===CUR&&num(i.day)){const dim=new Date(+CUR.slice(0,4),+CUR.slice(5,7),0).getDate();base=Math.max(0,avgVarOut()*(dim-num(i.day))/dim-S.tx.filter(t=>t.type==='out'&&t.date&&t.date.slice(0,7)===CUR&&+t.date.slice(8,10)>num(i.day)&&!isDizTx(t)&&!isGoalTx(t)).reduce((a,t)=>a+num(t.val),0))}return base}
function balanceAt(m){
 const ini=S.initial;if(!ini||!ini.month)return null;
 if(diffM(ini.month,m)<0)return num(ini.val);
 let b=num(ini.val);for(let k=ini.month;diffM(k,m)>=0;k=addM(k,1)){const d=iniDay(k),cur=k===CUR;
  if(!d&&!cur&&!(S.initial.settled&&k===ini.month)){b+=month(k).saldo;continue}
  receipts(k).forEach(r=>{if(!r.settled&&r.day>d&&(!cur||r.got))b+=r.val});
  outItems(k).forEach(o=>{if(!o.settled&&o.day>d&&(!cur||o.done))b-=o.val});
 }
 return b; // mês do saldo informado: só o que veio depois daquele dia; mês atual: só o que já entrou e já foi pago
}

/* ===== Trabalho: CLT pela lei (2026) e acordos de serviço ===== */
const INSS26=[[1621.00,.075],[2902.84,.09],[4354.27,.12],[8475.55,.14]];
function inssCalc(b){b=Math.max(0,num(b));let t=0,prev=0;for(const [lim,a] of INSS26){if(b>prev){t+=(Math.min(b,lim)-prev)*a}prev=lim}return Math.round(t*100)/100}
function irCalc(gross,inss,dep){ // IRRF mensal 2026 + redutor Lei 15.270/2025
 gross=num(gross);const ded=Math.max(num(inss)+num(dep)*189.59,607.20);const base=Math.max(0,gross-ded);
 const T=[[2428.80,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],[4664.68,.225,675.49],[1e12,.275,908.73]];
 let ir=0;for(const [lim,a,d] of T){if(base<=lim){ir=base*a-d;break}}ir=Math.max(0,ir);
 if(gross<=5000)ir=Math.max(0,ir-312.89);else if(gross<=7350)ir=Math.max(0,ir-Math.max(0,978.62-0.133145*gross));
 return Math.round(ir*100)/100;
}
function cltNet(gross,dep){const i=inssCalc(gross),r=irCalc(gross,i,dep);return {gross:num(gross),inss:i,ir:r,net:num(gross)-i-r}}
function cltCalc(y){ // valores do ano y
 const c=S.clt;if(!c||!c.on||!num(c.bruto))return null;
 const b=num(c.bruto),dep=num(c.dep),adm=c.adm||'2000-01';
 let avos=12;if(adm.slice(0,4)===String(y))avos=12-(+adm.slice(5,7))+1;if(+adm.slice(0,4)>y)avos=0;
 const t13=b*avos/12,p1=t13/2,i13=inssCalc(t13),r13=irCalc(t13,i13,dep),p2=t13-p1-i13-r13;
 const fb=b+b/3,fi=inssCalc(fb),fr=irCalc(fb,fi,dep);
 return {b,avos,t13,p1,p2,i13,r13,fer:{gross:fb,inss:fi,ir:fr,net:fb-fi-fr,terco:b/3},mes:cltNet(b,dep),fgts:b*.08};
}
function extraIn(m){
 const out=[];const y=+m.slice(0,4),mm=m.slice(5,7);const c=S.clt;
 const k=cltCalc(y);
 if(k&&k.avos>0){
  if(mm==='11'&&c.on13!==false)out.push({key:m+':clt:13a',work:1,kind:'13º salário · 1ª parcela',name:'13º salário (1ª parcela)',from:c.emp||'',day:30,val:k.p1});
  if(mm==='12'&&c.on13!==false)out.push({key:m+':clt:13b',work:1,kind:'13º salário · 2ª parcela (com descontos)',name:'13º salário (2ª parcela)',from:c.emp||'',day:20,val:k.p2});
 }
 if(k&&c.fer&&c.fer===m){out.push({key:m+':clt:fer',work:1,kind:'Férias + 1/3 (líquido)',name:'Férias',from:c.emp||'',day:Math.max(1,num(c.ferDay||1)),val:k.fer.net});}
 if(k&&c.fer&&c.ferAdj!==false&&addM(c.fer,1)===m){out.push({key:m+':clt:feradj',work:1,kind:'Ajuste: salário do mês de férias já veio junto com as férias',name:'Ajuste de férias',from:'',day:5,val:-k.mes.net});}
 (S.jobs||[]).forEach(j=>jobItems(j,m).forEach(x=>out.push({key:m+':job:'+j.id+':'+x.k,work:1,kind:x.lb,name:x.name,from:'',day:x.day,val:x.val})));
 (S.deals||[]).forEach(d=>dealSched(d).filter(x=>x.m===m).forEach(x=>out.push({key:m+':acd:'+d.id+':'+x.k,work:1,kind:'Acordo · '+x.lb,name:d.cli||'Serviço',from:d.cli||'',day:x.day,val:x.val})));
 return out;
}
function extraOut(m){
 const out=[];(S.deals||[]).forEach(d=>{const p=num(d.tax)/100;if(!p)return;dealSched(d).filter(x=>x.m===m).forEach(x=>out.push({day:x.day,name:'Imposto · '+(d.cli||'serviço'),kind:'Imposto do acordo ('+String(d.tax).replace('.',',')+'%)',val:x.val*p}))});
 return out;
}
function dealSched(d){ // parcelas do acordo: entrada + N parcelas mensais
 const out=[];const total=num(d.total),ent=Math.min(total,num(d.ent)),n=Math.max(0,Math.round(num(d.n)));
 if(ent>0&&d.entDate)out.push({k:'e',lb:'entrada',m:d.entDate.slice(0,7),day:+d.entDate.slice(8,10)||1,val:ent});
 const rest=total-ent;if(rest>0.004){const nn=Math.max(1,n),v=rest/nn;for(let j=0;j<nn;j++)out.push({k:'p'+j,lb:'parcela '+(j+1)+'/'+nn,m:addM(d.first||CUR,j),day:num(d.day)||10,val:v})}
 return out;
}
function dealStatus(d){
 const sc=dealSched(d);const g=S.got||{};const got=x=>{const key=x.m+':acd:'+d.id+':'+x.k;if(g[key]!=null)return !!g[key];const dd=diffM(x.m,CUR);return dd>0||(dd===0&&x.day<=TODAY.getDate())};
 const rec=sc.filter(got).reduce((a,x)=>a+x.val,0),total=num(d.total),tax=total*num(d.tax)/100,cost=num(d.cost),lucro=total-tax-cost;
 const nx=sc.find(x=>!got(x));return {sc,rec,falta:total-rec,tax,cost,lucro,marg:total?lucro/total:0,hora:num(d.horas)?lucro/num(d.horas):0,next:nx};
}

/* ===== Acordo de trabalho com o patrão (fora da CLT) ===== */
const MESES=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function jobActive(j,m){return (!j.start||diffM(j.start,m)>=0)&&(!j.end||diffM(m,j.end)>=0)}
function jobNet(j,v){return v*(1-num(j.desc)/100)}
function job13(j,y){ // valor bruto do 13º no ano y
 if(!j.t13||j.t13==='nao')return 0;const v=num(j.val);
 if(j.t13==='int')return v;if(j.t13==='metade')return v/2;
 let meses=12;if(j.start&&+j.start.slice(0,4)===y)meses=12-(+j.start.slice(5,7))+1;if(j.start&&+j.start.slice(0,4)>y)meses=0;
 if(j.end&&+j.end.slice(0,4)===y)meses=Math.min(meses,+j.end.slice(5,7));return v*meses/12;
}
function jobItems(j,m){ // o que este acordo paga no mês m
 const out=[];if(!num(j.val)&&!num(j.bonus))return out;const y=+m.slice(0,4),mm=+m.slice(5,7),nm=(jobPessoa(j)!=='Eu'?jobPessoa(j)+' · ':'')+(j.patrao||'Trabalho');
 const act=jobActive(j,m);
 if(act&&j.sal!==false&&num(j.val))out.push({k:'sal',lb:jobTipo(j)==='fixo'?'Salário':'Pagamento mensal',day:num(j.day)||5,val:jobNet(j,num(j.val))});
 if(act&&num(j.extra))out.push({k:'var',lb:'Extras/comissão (média)',day:num(j.day)||5,val:jobNet(j,num(j.extra))});
 const t=job13(j,y);
 if(t>0&&jobActive(j,m)||t>0&&j.end&&diffM(j.end,m)>=0&&mm===12&&+j.end.slice(0,4)===y){
  if(j.t13Split&&mm===11)out.push({k:'13a',lb:'13º · 1ª metade',day:30,val:jobNet(j,t/2)});
  if(mm===12)out.push({k:'13b',lb:j.t13Split?'13º · 2ª metade':'13º salário',day:20,val:jobNet(j,j.t13Split?t/2:t)});
 }
 if(act&&j.fer&&j.fer!=='nada'&&j.ferMonth===m){
  if(j.fer==='terco')out.push({k:'fer',lb:'Férias: 1/3 a mais',day:num(j.day)||5,val:jobNet(j,num(j.val)/3)});
  if(j.fer==='nao'&&j.sal!==false)out.push({k:'fer',lb:'Férias sem pagamento (mês sem salário)',day:num(j.day)||5,val:-jobNet(j,num(j.val))});
 }
 if(num(j.bonus)&&+j.bonusMonth===mm&&(act||(j.end&&diffM(j.end,m)===0)))out.push({k:'bon',lb:j.bonusName||'Bônus/gratificação',day:20,val:jobNet(j,num(j.bonus))});
 return out.map(x=>({...x,name:nm}));
}
function jobYear(j,from,to,pend){ // soma de from até to (pend: só o que ainda não caiu)
 const r={sal:0,ext:0,tot:0,rows:[]};for(let m=from;diffM(m,to)>=0;m=addM(m,1)){let it=jobItems(j,m);if(pend&&m===CUR)it=it.filter(x=>x.day>TODAY.getDate());const sal=it.filter(x=>x.k==='sal'||x.k==='var').reduce((a,x)=>a+x.val,0),ext=it.filter(x=>!(x.k==='sal'||x.k==='var')).reduce((a,x)=>a+x.val,0);r.sal+=sal;r.ext+=ext;r.tot+=sal+ext;r.rows.push({m,sal,ext,it})}return r;
}
function jobVsClt(j,y){ // o que a CLT daria a mais no ano, para comparar
 const v=num(j.val);let meses=12;if(j.start&&+j.start.slice(0,4)===y)meses=12-(+j.start.slice(5,7))+1;
 const l13=v*meses/12,lfer=v/3,fgts=v*.08*meses;const tem13=job13(j,y),temFer=j.fer==='terco'?v/3:0;
 return {l13,lfer,fgts,dif13:Math.max(0,l13-tem13),difFer:Math.max(0,lfer-temFer)};
}
function monthNext(name){const i=MESES.indexOf(name);if(i<0)return '';let y=+CUR.slice(0,4);const m=y+'-'+String(i+1).padStart(2,'0');return diffM(CUR,m)>=0?m:(y+1)+'-'+String(i+1).padStart(2,'0')}
function parseJob(t){
 const T=' '+norm(t)+' ';const R2={};const money=x=>num(String(x).replace(/\./g,'').replace(',','.'));
 const raw=' '+String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')+' ';
 const mv='(?:r\\$\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:,\\d{1,2})?)\\s*(mil|k)?';const val=m=>m?money(m[1])*(m[2]?1000:1):0;
 let m=raw.match(new RegExp(mv+'\\s*(?:reais\\s*)?(?:por mes|mensal|ao mes|/mes|todo mes)'));if(m)R2.val=val(m);
 if(!R2.val){m=raw.match(new RegExp('(?:salario|ganho|ganhar|paga|pagar|recebo|receber|combinamos|combinado|acordamos)[^\\d]{0,25}'+mv));if(m)R2.val=val(m)}
 m=raw.match(/(?:todo )?dia\s*(\d{1,2})/);if(m)R2.day=+m[1];
 if(/(nao|sem)\s+(tem\s+|paga\s+|vai pagar\s+|recebo\s+)?(o\s+)?(13|decimo)/.test(raw))R2.t13='nao';
 else if(/(13|decimo)[^.;]{0,30}(metade|meio)/.test(raw)||/(metade|meio)[^.;]{0,20}(13|decimo)/.test(raw))R2.t13='metade';
 else if(/(13|decimo)[^.;]{0,30}proporcional/.test(raw))R2.t13='prop';
 else if(/(13|decimo)/.test(raw))R2.t13='int';
 if(/(13|decimo)[^.;]{0,40}(duas|2)\s*(vezes|parcelas|x)/.test(raw)||/(13|decimo)[^.;]{0,40}novembro/.test(raw))R2.t13Split=true;
 if(/ferias[^.;]{0,40}(sem|nao)\s*(pagamento|pagar|remunera|receber|recebo|ganhar)/.test(raw)||/(nao|sem)\s+(tem\s+|paga\s+)ferias/.test(raw))R2.fer='nao';
 if(/(nao|nunca)\s+recebi[^.;]{0,15}(o\s+)?(13|decimo)/.test(raw))R2.h13='';else if(/recebi[^.;]{0,15}(o\s+)?(13|decimo)/.test(raw))R2.h13='int';
 else if(/ferias[^.;]{0,40}(1\/3|um terco|terco)/.test(raw)&&!/ferias[^.;]{0,25}sem\s*(o\s*)?(1\/3|um terco|terco)/.test(raw))R2.fer='terco';
 else if(/ferias[^.;]{0,30}(pagas|paga |pago|remunerad|recebo|ganho)/.test(raw)&&!/(nao|nunca)\s+(recebi|tive|tirei)[^.;]{0,10}ferias/.test(raw))R2.fer='simples';
 m=raw.match(/ferias[^.;]{0,40}?(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/);if(m)R2.ferMonth=monthNext(m[1]);
 m=raw.match(new RegExp('(bonus|bonificacao|gratificacao|abono|premio|cesta de natal|ajuda de natal|presente de natal|participacao)[^\\d]{0,25}'+mv));if(m){R2.bonus=val({1:m[2],2:m[3]});R2.bonusName=({gratificacao:'Gratificação',bonificacao:'Bonificação',bonus:'Bônus',premio:'Prêmio',participacao:'Participação',abono:'Abono','cesta de natal':'Cesta de Natal','ajuda de natal':'Ajuda de Natal','presente de natal':'Presente de Natal'})[m[1]]||'Bônus'}
 m=raw.match(/(bonus|bonificacao|gratificacao|abono|premio|natal|participacao)[^.;]{0,50}?(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro|natal|fim de ano|final do ano)/);if(m&&R2.bonus)R2.bonusMonth=(MESES.indexOf(m[2])>=0?MESES.indexOf(m[2])+1:12);else if(R2.bonus)R2.bonusMonth=12;
 m=raw.match(new RegExp('(?:comissao|extras?|horas extras|gorjeta|adicional)[^\\d]{0,30}'+mv));if(m)R2.extra=val(m);
 m=raw.match(/(?:desconto|desconta|descontar|inss|imposto|retencao)[^\d]{0,20}(\d{1,2}(?:,\d+)?)\s*%/);if(m)R2.desc=num(m[1].replace(',','.'));
 m=raw.match(/(?:comecei|comeco|entrei|desde|inicio)[^.;]{0,20}?(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s*(?:de\s*)?(\d{4}))?/);if(m){let y=m[2]||CUR.slice(0,4);if(/(comecei|comeco|entrei|desde|inicio)[^.;]{0,40}(ano passado)/.test(raw)&&!m[2])y=+CUR.slice(0,4)-1;if(/(comecei|comeco|entrei|desde|inicio)[^.;]{0,40}(retrasado)/.test(raw)&&!m[2])y=+CUR.slice(0,4)-2;R2.start=y+'-'+String(MESES.indexOf(m[1])+1).padStart(2,'0')}
 if(/(abri mao|abro mao|sem|nao tem|nao recebo|nao deposita|dispensei|renunciei)[^.;]{0,15}(do\s+|de\s+|o\s+)?fgts/.test(raw))R2.noFgts=true;

/* ===== histórico do acordo informal e balanço pela referência da CLT ===== */
function isoAddY(d,n){const [y,m,dd]=d.split('-').map(Number);return (y+n)+'-'+String(m).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}
function isoAddD(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function dBR(d){return d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):''}
function jobStartD(j){return j.startDate||(j.start?j.start+'-01':'')}
function jobEndD(j){return j.working===false&&j.endDate?j.endDate:todayISO()}
function avosIn(y,a,b){ // meses do ano y com 15+ dias trabalhados entre as datas a..b
 let n=0;for(let mo=1;mo<=12;mo++){const ms=y+'-'+String(mo).padStart(2,'0');const first=ms+'-01',last=isoAddD(addM(ms,1)+'-01',-1);
  const s0=a>first?a:first,e0=b<last?b:last;if(s0>e0)continue;const days=(new Date(e0+'T12:00:00')-new Date(s0+'T12:00:00'))/864e5+1;if(days>=15)n++}return n;
}
function jobPeriods(j){ // períodos aquisitivos de férias
 const a=jobStartD(j);if(!a)return [];const end=jobEndD(j);const out=[];
 for(let k=0;k<40;k++){const ps=isoAddY(a,k);if(ps>end)break;const pe=isoAddD(isoAddY(a,k+1),-1);const done=pe<=end;
  out.push({k:k+1,ps,pe,done,limit:isoAddD(isoAddY(a,k+2),-1)});if(!done)break}
 return out;
}
function jobBal(j){
 const a=jobStartD(j);if(!a||!num(j.val))return null;const v=num(j.val),end=jobEndD(j),today=todayISO(),H=j.hist||{};
 const r={t13:[],fer:[],prop:null,fgts:0,falta:0,meses:0};
 const y0=+a.slice(0,4),y1=+end.slice(0,4);
 for(let y=y0;y<=y1;y++){
  const done=y<+CUR.slice(0,4)||(j.working===false&&y===y1);if(!done)continue;
  const av=avosIn(y,a,end),dev=v*av/12;const h=H['13:'+y]||{};const got=h.st==='int'?dev:h.st==='parte'?num(h.val):0;
  r.t13.push({y,av,dev,got,dif:Math.max(0,dev-got),st:h.st||''});r.falta+=Math.max(0,dev-got);
 }
 jobPeriods(j).forEach(p=>{
  if(!p.done){ // proporcional do período em andamento
   const av=Math.min(12,Math.max(0,Math.round(diffM(p.ps.slice(0,7),end.slice(0,7))+((+end.slice(8,10))-(+p.ps.slice(8,10))>=14?1:0))));
   r.prop={k:p.k,av,val:v*4/3*av/12,ps:p.ps,pe:p.pe};return}
  const h=H['fer:'+p.k]||{};const dev=v*4/3;let got=0,lb='Não recebi';
  if(h.st==='terco'){got=dev;lb='Recebi com 1/3'}else if(h.st==='simples'){got=v;lb='Recebi sem o 1/3'}else if(h.st==='parte'){got=num(h.val);lb='Recebi uma parte'}
  const venc=today>p.limit&&h.st!=='terco'&&h.st!=='simples';const tot=venc?dev*2:dev;const dif=Math.max(0,tot-got);

async function checkUpdate(){

  if(j&&j.version&&j.version!==APP_VERSION){if(!newVersion||newVersion.version!==j.version){newVersion=j;showUpdatePill()}}}catch(e){}
}
function showUpdatePill(){
 let el=document.getElementById('updPill');
 if(!newVersion){if(el)el.remove();return}
 if(!el){el=document.createElement('button');el.id='updPill';el.className='updpill';el.setAttribute('data-act','doUpdate');document.body.appendChild(el)}
 el.textContent='🔄 Nova versão '+newVersion.version+' · Atualizar';
}
async function doUpdate(){
 try{if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
 try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update().catch(()=>{})))}}catch(e){}
 location.replace(location.pathname+'?v='+(newVersion?newVersion.version:Date.now()));
}

/* ---------- motor de cálculo ---------- */
function instParcel(i){return parcelaPrice(i.total,i.n,i.rate||0)}
function instInMonth(i,m){const k=diffM(i.first,m);return k>=0&&k<i.n}
function instStatus(i){
 const p=instParcel(i);const k=diffM(i.first,CUR);
 const paid=Math.max(0,Math.min(i.n,k+1)); // parcela do mês atual conta como deste mês
 const rem=i.n-paid; return {p,paid,rem,remVal:rem*p,end:addM(i.first,i.n-1),totalPaid:p*i.n,juros:p*i.n-i.total,curK:k};
}
function inInMonth(i,m){const k=diffM(i.first,m);return k>=0&&k<i.n}
function inParcel(i){return num(i.total)/Math.max(1,i.n)}
function inGot(i,m){const g=(S.got||{})[m+':ini:'+i.id];if(g!=null)return !!g;const d=diffM(m,CUR);return d>0||(d===0&&(i.day||10)<=TODAY.getDate())}
function inStatus(i){const p=inParcel(i),k=diffM(i.first,CUR);const flags=Array.from({length:i.n},(_,j)=>inGot(i,addM(i.first,j)));const got=flags.filter(Boolean).length,rem=i.n-got;
 const nextK=flags.findIndex(f=>!f);return {p,got,rem,remVal:rem*p,end:addM(i.first,i.n-1),curK:k,flags,next:nextK>=0?addM(i.first,nextK):null}}
function recActive(r,m){return !r.start||diffM(r.start,m)>=0}
function isDizTx(t){return !!t.diz||(t.cat==='Doações'&&/^(Dízimo|Oferta) · /.test(t.desc||''))}
function isGoalTx(t){return !!t.goal}
function txCashMonth(t){const c=t.type==='out'&&cardById(t.cardId);return c?dueMonthOf(t.date,c):t.date.slice(0,7)} // compra no cartão sai do caixa no mês da fatura
function month(m){
 const inParc=(S.instIn||[]).filter(i=>inInMonth(i,m)).reduce((a,i)=>a+inParcel(i),0);
 const inExtra=extraIn(m).reduce((a,r)=>a+r.val,0),outExtra=extraOut(m).reduce((a,r)=>a+r.val,0);
 const inFix=S.rec.filter(r=>r.type==='in'&&recActive(r,m)).reduce((a,r)=>a+num(r.val),0)+inParc+inExtra;
 const outFix=S.rec.filter(r=>r.type==='out'&&recActive(r,m)).reduce((a,r)=>a+num(r.val),0)+outExtra;
 const parc=S.inst.filter(i=>instInMonth(i,m)).reduce((a,i)=>a+instParcel(i),0);
 const inVar=S.tx.filter(t=>t.type==='in'&&t.date&&t.date.slice(0,7)===m).reduce((a,t)=>a+num(t.val),0);
 const outs=S.tx.filter(t=>t.type==='out'&&t.date&&txCashMonth(t)===m);
 const outVar=outs.reduce((a,t)=>a+num(t.val),0);
 const outDiz=outs.filter(isDizTx).reduce((a,t)=>a+num(t.val),0),outGoal=outs.filter(isGoalTx).reduce((a,t)=>a+num(t.val),0);
 const outDia=outVar-outDiz-outGoal; // gastos do dia a dia (sem dízimo e sem dinheiro guardado em metas)
 const entradas=inFix+inVar, saidas=outFix+parc+outVar;
 return {m,inFix,inParc,outFix,parc,inVar,outVar,outDia,outDiz,outGoal,entradas,saidas,saldo:entradas-saidas};
}
function avgVarOut(){ // média dos gastos do dia a dia dos últimos 3 meses completos (sem dízimo e metas)
 const ms=[-1,-2,-3].map(k=>addM(CUR,k)).map(month).filter(x=>x.outDia>0);
 if(ms.length)return ms.reduce((a,x)=>a+x.outDia,0)/ms.length;
 return month(CUR).outDia;
}
function titheOut(m){ // dízimo + ofertas previstos no mês (no mês atual: só o que falta devolver)
 if(S.titheProj===false)return 0;const t=titheCalc(m);return diffM(CUR,m)<=0?Math.max(0,t.total-t.paidVal):t.total;
}
function projSobra(m){const x=month(m);return x.inFix+x.inVar-x.outFix-x.parc-Math.max(avgVarOut(),x.outDia)-(x.outVar-x.outDia)-titheOut(m)}
function projection(n){const out=[];for(let k=0;k<n;k++){const m=addM(CUR,k);const x=month(m);out.push({m,parc:x.parc,sobra:k===0?x.saldo-varRestOf()-titheOut(m):projSobra(m)})}return out}
function debtFree(){let last=null;S.inst.forEach(i=>{const e=addM(i.first,i.n-1);if(diffM(CUR,e)>=0&&(!last||diffM(last,e)>0))last=e});return last}
function goalMonths(g){
 let saved=num(g.saved);const target=num(g.target),r=num(g.rate)/100;
 if(saved>=target)return 0;
 for(let k=0;k<600;k++){
  const m=addM(CUR,k+1);
  const ap=g.mode==='fixed'?num(g.monthly):Math.max(0,projSobra(m));
  saved=saved*(1+r)+ap;
  if(saved>=target)return k+1;
 }
 return null;
}
function monthsToSave(target,r){ // usando a sobra projetada
 let s=0;r=r/100;for(let k=0;k<600;k++){s=s*(1+r)+Math.max(0,projSobra(addM(CUR,k+1)));if(s>=target)return k+1}return null}

function chart(P){
 const W=620,H=230,pl=56,pr=12,pt=14,pb=28;
 const vals=P.flatMap(p=>[p.sobra,p.parc,0]);
 let max=Math.max(...vals),min=Math.min(...vals);
 const span=(max-min)||1; const step=nice(span/4);
 max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step; if(max===min)max=min+step;
 const y=v=>pt+(max-v)/(max-min)*(H-pt-pb);
 const bw=(W-pl-pr)/P.length;
 let g='';
 for(let v=min;v<=max+1e-6;v+=step){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1" '+(Math.abs(v)<1e-6?'':'stroke-dasharray="3 4"')+'/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+short(v)+'</text>'}
 P.forEach((p,i)=>{
  const x=pl+i*bw+bw*0.2,w=bw*0.6,y0=y(0),y1=y(p.sobra);
  g+='<rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+w+'" height="'+Math.max(1,Math.abs(y1-y0))+'" rx="3" fill="'+(p.sobra>=0?'var(--accent)':'var(--bad)')+'" opacity="'+(i===0?1:.78)+'"><title>'+mLabel(p.m)+': '+R(p.sobra)+'</title></rect>';
  g+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+mLabel(p.m).slice(0,3)+'</text>';
 });
 const pts=P.map((p,i)=>(pl+i*bw+bw/2)+','+y(p.parc)).join(' ');
 g+='<polyline points="'+pts+'" fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-linejoin="round"/>';
 P.forEach((p,i)=>g+='<circle cx="'+(pl+i*bw+bw/2)+'" cy="'+y(p.parc)+'" r="3.2" fill="var(--panel)" stroke="var(--accent2)" stroke-width="2"><title>Parcelas '+mLabel(p.m)+': '+R(p.parc)+'</title></circle>');
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:480px;height:auto" role="img" aria-label="Previsão de sobra e parcelas nos próximos 12 meses">'+g+'</svg>';
}
function nice(x){const e=Math.pow(10,Math.floor(Math.log10(x)));const f=x/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

function insights(){

 if(sob<0)out.push(['bad','Mês que vem a previsão é de <b>falta de '+R0(-sob)+'</b>. Corte gastos variáveis ou adie compras.']);

 const weekAgo=new Date(TODAY.getTime()-7*864e5).toISOString().slice(0,10);
 ids.sort((a,b)=>(b===ME.id)-(a===ME.id)||(online(b)?1:0)-(online(a)?1:0)||((MEMBERS[b]||{}).lastAt||0)-((MEMBERS[a]||{}).lastAt||0));
 const d=x=>x?String(x).split('-').reverse().join('/'):'—';

 const ativos=ids.filter(u=>st(u)==='ok').length,on=ids.filter(online).length,novos=ids.filter(u=>((MEMBERS[u]||{}).first||'')>=weekAgo).length;

   '<div class="s">'+(m.email?esc(m.email)+' · ':'')+'desde '+d(m.first)+' · último acesso '+(m.lastAt?ago(m.lastAt):d(m.last))+' · '+n+' sugest'+(n===1?'ão':'ões')+'</div></div>'+

async function admUser(u,s){

}

function asSpend(q){ // "o que gastei com X nos últimos 3 meses"
 if(!/(gastei|gasto|gastos|gastamos|paguei|pagamos|despesa|saiu|sairam|comprei)/.test(q))return null;
 const NUM={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12};
 let from=CUR,to=CUR,per='em '+mLabel(CUR,true);let m;
 if((m=q.match(/ultim[oa]s? (\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze) mes/))){const n=+m[1]||NUM[m[1]]||3;from=addM(CUR,-(n-1));per='nos últimos '+n+' meses ('+mLabel(from)+' a '+mLabel(CUR)+')'}
 else if(/mes passado|ultimo mes/.test(q)){from=to=addM(CUR,-1);per='em '+mLabel(from,true)}
 else if(/(este|esse|neste|nesse) ano|no ano/.test(q)){from=CUR.slice(0,4)+'-01';per='em '+CUR.slice(0,4)+' (até agora)'}
 else if((m=q.match(/(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/))){const i=MESES.indexOf(m[1])+1;let y=+CUR.slice(0,4);let mm=y+'-'+String(i).padStart(2,'0');if(diffM(mm,CUR)<0)mm=(y-1)+'-'+String(i).padStart(2,'0');from=to=mm;per='em '+mLabel(mm,true)}
 // termo: o que vem depois de "com/em/de/no/na"
 let term='';const tm=q.match(/(?:gastei|gasto|gastos|gastamos|paguei|pagamos|despesas?|saiu|sairam|comprei)\s+(?:o que\s+)?(?:com|em|de|no|na|nos|nas|pra|para)\s+(.+)/);
 if(tm){term=tm[1].replace(/\b(nos|nas|no|na|nesse|neste|este|esse|em|de|do|da|dos|das|durante)?\s*(ultim[oa]s?\s+\S+\s+mes(es)?|mes passado|ultimo mes|este mes|esse mes|neste mes|nesse mes|mes|este ano|esse ano|no ano|janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b.*$/,'').replace(/\b(eu|o|a|os|as|que|ate agora|so)\b/g,' ').replace(/\s+/g,' ').trim()}
 if(/^(mes|ano|ultimos?|este|esse)$/.test(term))term='';
 const L=extItems(from,to).filter(x=>x.val<0&&(x.st==='ok'||x.st==='okp'||(x.st==='base'&&x.src.indexOf('Lançamentos')===0))&&(!term||norm(x.desc+' '+x.kind+' '+x.src).includes(term)));
 const tot=-L.reduce((a,x)=>a+x.val,0);
 const top=[...L].sort((a,b)=>a.val-b.val).slice(0,6).map(x=>x.date.slice(8,10)+'/'+x.date.slice(5,7)+' · '+esc(x.desc)+' <b>'+R(-x.val)+'</b>').join('<br>');
 const msg=L.length?'Você gastou <b>'+R(tot)+'</b>'+(term?' com <b>'+esc(term)+'</b>':'')+' '+per+' — '+L.length+(L.length>1?' itens':' item')+'.'+(top?'<br><span style="font-size:13px">'+top+(L.length>6?'<br>…':'')+'</span>':''):'Não encontrei gastos'+(term?' com <b>'+esc(term)+'</b>':'')+' '+per+'. Só aparecem gastos já lançados ou contas pagas.';
 return [msg,[['📜 Ver no Extrato','ext:'+term+'|'+from+'|'+to]]];
}
function asData(q){

 const has=(...w)=>w.some(x=>q.includes(x));
 const asks=has('quanto','quando','qual ','quais','tenho','sobra','sobrou','proximo','o que vence');
 if(!asks)return null;
 const x=month(CUR);
 if(has('saldo','tenho na conta','quanto tenho')){const b=balanceAt(CUR);return b==null?['Ainda não sei seu saldo: informe o <b>saldo inicial</b>. Pelo que está lançado, o resultado de '+mLabel(CUR,true)+' é <b>'+R(x.saldo)+'</b>.',[['Informar saldo inicial','saldoIni']]]:['Seu saldo em conta agora é <b>'+R(b)+'</b>. Ainda falta receber '+R(pendingIn(CUR))+' e pagar '+R(pendingOut(CUR))+'. Com tudo (dia a dia e dízimo), você fecha '+mLabel(CUR,true)+' com cerca de <b>'+R(nowStatus().fim)+'</b>.',[['Abrir Painel','v:painel']]]}
 if(has('gastei','gasto do mes','gastos do mes','gastando','saiu','despesas')){const c=Object.entries(spentByCat(CUR)).sort((a,b)=>b[1]-a[1])[0];return ['Em '+mLabel(CUR,true)+' saíram <b>'+R(x.saidas)+'</b> (fixas '+R(x.outFix)+', parcelas '+R(x.parc)+', dia a dia '+R(x.outDia)+(x.outDiz?', dízimo/oferta '+R(x.outDiz):'')+(x.outGoal?', guardado em metas '+R(x.outGoal):'')+').'+(c?' O maior gasto foi <b>'+esc(c[0])+'</b>: '+R(c[1])+'.':''),[['Ver Orçamento','v:orc']]]}
 if(has('maior gasto','onde mais gasto','mais gastei')){const c=Object.entries(spentByCat(CUR)).sort((a,b)=>b[1]-a[1]).slice(0,3);return [c.length?'Seus maiores gastos este mês: '+c.map(([k,v])=>'<b>'+esc(k)+'</b> '+R0(v)).join(', ')+'.':'Ainda não há gastos neste mês.',[['Ver Orçamento','v:orc']]]}
 if(has('sobra','sobrar','sobrou','sobrando')){const s=projSobra(addM(CUR,1));return [s>=0?'A previsão é sobrar <b>'+R(s)+'</b> no mês que vem.':'A previsão é <b>faltar '+R(-s)+'</b> no mês que vem. Veja o Orçamento para cortar gastos.',[['Abrir Painel','v:painel']]]}
 if(has('quito','quitar','livre das parcelas','livre de parcelas','acaba as parcelas','terminar as parcelas','parcelas')){const d=debtFree();return [d?'Você fica <b>livre das parcelas em '+mLabel(d,true)+'</b>. Neste mês as parcelas somam '+R(x.parc)+'.':'Você não tem parcelas ativas.',[['Ver Parcelados','v:parc']]]}
 if(has('dizimo','oferta')){const c=titheCalc(CUR);return ['Em '+mLabel(CUR,true)+': dízimo <b>'+R(c.d)+'</b> e ofertas <b>'+R(c.o)+'</b>, total '+R(c.total)+'. Já devolvido: '+R(c.paidVal)+'.',[['Abrir Dízimos','dizimo']]]}
 if(has('vence','vencimento','proximo pagamento','o que pagar','falta pagar')){const l=bills(CUR).filter(b=>!b.paid);const n=l.find(b=>b.day>=TODAY.getDate())||l[0];return [n?'Próximo pagamento: <b>'+esc(n.name)+'</b>'+(n.to&&n.to!==n.name?' (para '+esc(n.to)+')':'')+', dia '+String(n.day).padStart(2,'0')+', <b>'+R(n.val)+'</b>. Faltam '+l.length+' pagamento'+(l.length===1?'':'s')+' no mês.':'Tudo pago neste mês. 🎉',[['Abrir A pagar','v:pagar']]]}
 if(has('meta','juntar')){const g=S.goals[0];if(!g)return ['Você ainda não tem metas.',[['Nova meta','meta']]];const m=goalMonths(g);return ['Meta <b>'+esc(g.name)+'</b>: '+(m==null?'com a sobra atual não dá para juntar.':m===0?'já atingida!':'chega em '+dur(m)+' ('+mLabel(addM(CUR,m),true)+').'),[['Ver Metas','v:metas']]]}
 if(has('renda','ganho','salario','entrou')){return ['Neste mês entraram <b>'+R(x.entradas)+'</b> (fixas '+R(x.inFix)+', avulsas '+R(x.inVar)+').',[['Ver Fixas','v:fixas']]]}
 return null;
}
function asAnswer(raw){
 const q=' '+norm(raw)+' ';
 const web=/^ ?(pesquis|procur|busca|google|na internet|o que e |o que significa|como funciona|cotacao|taxa selic|quanto esta o|preco d)/.test(q)||q.includes(' na internet ');
 if(!web){const d=asData(q);if(d)return d}
 let best=null,score=0;
 if(!web&&/ (13|13o|decimo|ferias|fgts|clt|inss|holerite) /.test(q.replace(/[^a-z0-9 ]/g,' '))){const k=AS_KB.find(x=>x[0][0]==='13');let msg=k[1];const c=cltCalc(+CUR.slice(0,4));if(c)msg='Pela lei (tabelas 2026): <b>13º</b> '+R(c.p1+c.p2)+' (1ª '+R(c.p1)+' em 30/11, 2ª '+R(c.p2)+' em 20/12) · <b>férias + 1/3</b> líquidas '+R(c.fer.net)+' · <b>FGTS</b> '+R(c.fgts)+'/mês · líquido mensal '+R(c.mes.net)+'.';return [msg,k[2],true]}
 if(!web)AS_KB.forEach(k=>{let s=0;k[0].forEach(w=>{if(q.includes(' '+w)||q.includes(w+' ')||q.includes(w))s+=w.length>5?2:1});if(s>score){score=s;best=k}});
 if(best&&score>0){if(best[0][0]==='usuarios'&&!ME.owner)best=AS_KB.find(k=>k[0][0]==='manual');return [best[1],best[2],true]}
 const term=raw.replace(/^(pesquis(e|ar|a)|procur(e|ar|a)|busc(a|ar|que)|google)\s*(na internet|no google)?\s*(sobre|por)?\s*/i,'').trim()||raw;
 return [web?'Abri a pesquisa no Google numa nova aba. Se não abriu, toque no botão:':'Não encontrei isso no app, então abri uma pesquisa no Google numa nova aba. Se não abriu, toque no botão:',[['🔎 Pesquisar "'+term.slice(0,40)+'"','web:'+term]],false,true];
}

}

function catUse(name,type){
 let n=0;S.tx.forEach(t=>{if(t.cat===name&&(type==='in'?t.type==='in':t.type==='out'))n++});
 S.rec.forEach(r=>{if(r.cat===name&&(type==='in'?r.type==='in':r.type==='out'))n++});
 if(type==='out')S.inst.forEach(i=>{if(i.cat===name)n++});
 else (S.instIn||[]).forEach(i=>{if(i.cat===name)n++});
 return n;
}
function renameCatEverywhere(type,from,to){
 const isT=x=>type==='in'?x.type==='in':x.type==='out';
 S.tx.forEach(t=>{if(t.cat===from&&isT(t))t.cat=to});
 S.rec.forEach(r=>{if(r.cat===from&&isT(r))r.cat=to});
 if(type==='in')(S.instIn||[]).forEach(i=>{if(i.cat===from)i.cat=to});
 if(type==='out'){S.inst.forEach(i=>{if(i.cat===from)i.cat=to});if(S.budget&&S.budget[from]!=null){S.budget[to]=S.budget[from];delete S.budget[from]}}
}

   else S.cats.out.push({name:nn,desc,pct});
  }else{
   if(name){S.cats.in=S.cats.in.map(x=>x===name?nn:x);if(nn!==name)renameCatEverywhere('in',name,nn)}

function delCat(type,name){
 ensureCats();
 const fallback='Outros';
 if(type==='out'){if(!S.cats.out.some(c=>c.name===fallback)&&name!==fallback)S.cats.out.push({name:fallback,desc:'Gastos que não se encaixam nas outras categorias.',pct:0});S.cats.out=S.cats.out.filter(c=>c.name!==name);if(S.budget)delete S.budget[name]}
 else{if(!S.cats.in.includes(fallback)&&name!==fallback)S.cats.in.push(fallback);S.cats.in=S.cats.in.filter(c=>c!==name)}
 const to=name===fallback?(type==='out'?(S.cats.out[0]||{}).name:S.cats.in[0]):fallback;
 if(to)renameCatEverywhere(type,name,to);
 S.demo=false;commit('Categoria excluída');
}

let dizMonth=CUR;
function tithe(){S.tithe=S.tithe||{offer:5};const T=S.tithe;T.rows=T.rows||{};T.pr=T.pr||{};if(T.offer==null)T.offer=5;return T}
function titheRows(m){
 const T=tithe(),ov=T.rows[m]||{},pr=T.pr[m]||{};const src=[];
 if(S.initial&&S.initial.month&&diffM(S.initial.month,m)<0)return [];
 S.rec.filter(r=>r.type==='in'&&recActive(r,m)&&!isSettled(m,r.day||1,true)).forEach(r=>src.push({key:'rec-'+r.id,desc:r.desc,cat:r.cat,val:num(r.val),fixa:true}));
 (S.instIn||[]).filter(i=>inInMonth(i,m)&&!isSettled(m,i.day||10,false)).forEach(i=>src.push({key:'ini-'+i.id,desc:i.desc+' ('+(diffM(i.first,m)+1)+'/'+i.n+')',cat:i.cat,val:inParcel(i),fixa:true}));
extraIn(m).filter(r=>r.val>0&&!isSettled(m,r.day,r.key.indexOf(':acd:')<0)).forEach(r=>src.push({key:'ex-'+r.key.split(':').slice(1).join(':'),desc:r.name+(r.kind&&r.kind!==r.name?' · '+r.kind:''),cat:'Trabalho',val:r.val,fixa:true}));
 S.tx.filter(t=>t.type==='in'&&t.date&&t.date.slice(0,7)===m&&!isSettled(m,+t.date.slice(8,10)||1,false)).forEach(t=>src.push({key:'tx-'+t.id,desc:t.desc,cat:t.cat,val:num(t.val),fixa:false}));
 return src.map(s=>{const o=ov[s.key]||{};
  const dAuto=s.val*0.10,oAuto=s.val*num(T.offer)/100;
  return {...s,inc:!o.off,d:o.d!=null?num(o.d):dAuto,o:o.o!=null?num(o.o):oAuto,edited:o.d!=null||o.o!=null,paid:pr[s.key]||null};
 });
}
function offersFor(m){
 const T=tithe();T.extra=T.extra||[];
 return T.extra.filter(x=>x.month===m||(x.rec&&diffM(x.month,m)>=0&&(!x.end||diffM(m,x.end)>=0))).map(x=>({...x,paid:(x.paid||{})[m]||null}));
}
function titheCalc(m){
 const rows=titheRows(m),inc=rows.filter(r=>r.inc),ex=offersFor(m);
 const d=inc.reduce((a,r)=>a+r.d,0),oP=inc.reduce((a,r)=>a+r.o,0),oX=ex.reduce((a,x)=>a+num(x.val),0);
 const paid=inc.filter(r=>r.paid).reduce((a,r)=>a+r.paid.d+r.paid.o,0)+ex.filter(x=>x.paid).reduce((a,x)=>a+num(x.paid.val),0);
 const base=inc.reduce((a,r)=>a+r.val,0);
 return {rows,ex,base,d,o:oP+oX,oP,oX,total:d+oP+oX,paidVal:paid,pend:inc.filter(r=>!r.paid).length+ex.filter(x=>!x.paid).length,nInc:inc.length+ex.length};
}

function dzPayRow(m,r){
 const T=tithe();T.pr[m]=T.pr[m]||{};
 const date=m===CUR?todayISO():m+'-'+String(Math.min(28,TODAY.getDate())).padStart(2,'0');const ids=[];
 if(r.d>0){const id=uid();ids.push(id);S.tx.push({id,diz:1,type:'out',desc:'Dízimo · '+r.desc+' ('+mLabel(m)+')',cat:'Doações',val:Math.round(r.d*100)/100,date,pay:'Pix'})}
 if(r.o>0){const id=uid();ids.push(id);S.tx.push({id,diz:1,type:'out',desc:'Oferta · '+r.desc+' ('+mLabel(m)+')',cat:'Doações',val:Math.round(r.o*100)/100,date,pay:'Pix'})}
 T.pr[m][r.key]={d:r.d,o:r.o,date,tx:ids};
}
function dzSetOv(m,k,patch){const T=tithe();T.rows[m]=T.rows[m]||{};const o=Object.assign({},T.rows[m][k]||{},patch);for(const f in o)if(o[f]===undefined)delete o[f];if(Object.keys(o).length)T.rows[m][k]=o;else delete T.rows[m][k];S.demo=false}

function payOffer(m,id){
 const T=tithe(),x=(T.extra||[]).find(o=>o.id===id);if(!x)return;
 const date=m===CUR?todayISO():m+'-'+String(Math.min(28,TODAY.getDate())).padStart(2,'0');
 const tid=uid();S.tx.push({id:tid,diz:1,type:'out',desc:'Oferta · '+x.name+' ('+mLabel(m)+')',cat:'Doações',val:Math.round(num(x.val)*100)/100,date,pay:'Pix'});
 x.paid=x.paid||{};x.paid[m]={val:num(x.val),date,tx:[tid]};S.demo=false;
}

async function doAuth(){
 const v=id=>{const el=document.getElementById(id);return el?el.value.trim():''};

  }else if(authMode==='reset'){

  }else{
   if(!email||!pass)throw{msg:'Preencha e-mail e senha.'};
   setBusy(true);
   await AUTH.signInWithEmailAndPassword(email,pass);
  }
  authBusy=false;
 }catch(e){
  setBusy(false);pendingTerms=false;pendingName='';
  setAuthErr(e&&e.msg?e.msg:authErr(e));
 }
}

function amortSched(fin,n,rate,first,o){ // tabela Price com amortizações extras
 o=o||{};const r=rate/100;let bal=fin,p=parcelaPrice(fin,n,rate);const rows=[];let tp=0,ti=0;
 for(let k=0;k<n&&bal>0.005;k++){const m=addM(first,k);const it=bal*r;let pay=Math.min(p,bal+it);bal=bal+it-pay;let ex=0;
  if(o.on){ex+=num(o.monthly);if(o.oneM===m)ex+=num(o.one);if(num(o.yearly)&&+m.slice(5,7)===(+o.yearM||12))ex+=num(o.yearly);ex=Math.min(ex,Math.max(0,bal));bal-=ex;
   if(ex>0&&o.mode==='parcela'&&bal>0.005)p=parcelaPrice(bal,n-k-1,rate)}
  tp+=pay+ex;ti+=it;rows.push({m,pay,it,ex,bal:Math.max(0,bal),p})}
 return {rows,end:rows.length?rows[rows.length-1].m:first,months:rows.length,totalPaid:tp,interest:ti,p0:parcelaPrice(fin,n,rate),pLast:rows.length?rows[rows.length-1].p:0};
}

function parseDeal(t){ // lê o texto do acordo e sugere valores
 const T=' '+String(t||'').toLowerCase().replace(/\s+/g,' ')+' ';const money=x=>num(String(x).replace(/\./g,'').replace(',','.'));
 const r={};const mv='(?:r\\$\\s*)?(\\d{1,3}(?:\\.\\d{3})*(?:,\\d{1,2})?|\\d+(?:,\\d{1,2})?)\\s*(mil|k)?';const val=(m)=>m?money(m[1])*(m[2]?1000:1):0;
 let m=T.match(new RegExp('(?:total|valor|fechado|fechamos|cobrar|cobrei|or[cç]amento)[^\\d]{0,25}'+mv));if(m)r.total=val(m);
 m=T.match(new RegExp('entrada[^\\d]{0,15}'+mv));if(m)r.ent=val(m);
 m=T.match(/entrada[^\d]{0,12}(\d{1,3})\s*%/);if(m&&r.total)r.ent=r.total*num(m[1])/100;
 m=T.match(/(\d{1,2})\s*(?:x|vezes|parcelas|presta[cç][oõ]es|meses)/);if(m)r.n=+m[1];
 m=T.match(/(?:imposto|nota|iss|simples|mei)[^\d]{0,15}(\d{1,2}(?:,\d+)?)\s*%/);if(m)r.tax=num(m[1].replace(',','.'));
 m=T.match(new RegExp('(?:material|materiais|custo|custos|gasto)[^\\d]{0,20}'+mv));if(m)r.cost=val(m);
 m=T.match(/(\d{1,4})\s*(?:h\b|horas)/);if(m)r.horas=+m[1];
 m=T.match(/dia\s*(\d{1,2})/);if(m)r.day=+m[1];
 if(!r.total){const all=[...T.matchAll(/r\$\s*(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:,\d{1,2})?)/g)].map(x=>money(x[1]));if(all.length)r.total=Math.max(...all)}
 return r;
}

 if(e.target.dataset&&e.target.dataset.dz){const v=Math.max(0,num(e.target.value));dzSetOv(dizMonth,e.target.dataset.dz,{[e.target.dataset.fld]:v});commit((e.target.dataset.fld==='d'?'Dízimo':'Oferta')+' ajustado');return}
 if(e.target.dataset&&e.target.dataset.dzinc){dzSetOv(dizMonth,e.target.dataset.dzinc,{off:e.target.checked?undefined:true});commit(e.target.checked?'Entrada incluída':'Entrada fora do dízimo');return}
 if(e.target.id==='offRange'){tithe().offer=num(e.target.value);S.demo=false;commit('Oferta: '+String(e.target.value).replace('.',',')+'%');return}
 const c=e.target.dataset&&e.target.dataset.bud;if(!c)return;
 S.budget=S.budget||{};{const v=Math.max(0,Math.min(100,num(e.target.value))),d=catDef(c);if(d){d.pct=v;delete S.budget[c]}else S.budget[c]=v}S.demo=false;commit('Percentual de '+c+' atualizado');
});
document.addEventListener('submit',async e=>{
 if(e.target.id==='asBarForm'||e.target.id==='asForm'){e.preventDefault();const i=e.target.querySelector('input');const t=i.value;i.value='';AS_OPEN=true;asAsk(t);return}
 if(e.target.id==='authForm'){e.preventDefault();if(!authBusy)doAuth();return}
 if(e.target.id==='localForm'){e.preventDefault();locked=false;render();return}
 if(e.target.id==='termsForm'){e.preventDefault();const c=document.getElementById('termsChk');if(!c||!c.checked){toast('Marque "Li e estou ciente" para continuar');return}S.termsAt=todayISO();commit();return}
 if(e.target.id!=='ideaForm')return;e.preventDefault();
 const t=document.getElementById('ideaText').value.trim();if(!t){toast('Escreva a sugestão primeiro.');return}
 saveIdeas(getIdeas().concat([{id:uid(),kind:document.getElementById('ideaKind').value,text:t,status:'Nova',date:CUR+'-'+String(TODAY.getDate()).padStart(2,'0')}]));toast(ideasRef?'Sugestão enviada ao desenvolvedor':'Sugestão registrada');
});
function closeSheetQuiet(){document.getElementById('sheet').innerHTML=''}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:16px;right:16px;bottom:100px;height:140px;z-index:70;background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:10px;padding:10px';document.body.appendChild(ta);ta.select();toast('Selecionei o texto: copie com Ctrl+C');ta.addEventListener('blur',()=>ta.remove())}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#sheet .sheet'))closeSheet()});
let tt;function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;clearTimeout(tt);tt=setTimeout(()=>t.remove(),2600)}
const _render=render;render=function(){_render();qc()};
boot();
})();
</script>
</body>
</html>
