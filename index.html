<!doctype html>
<html lang="pt-BR">
<head>
<title>Cofre Pessoal</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="Cofre Pessoal: gestão financeira pessoal, dízimos, metas e orçamento.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cofre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cockpit financeiro — trilho de navegação à esquerda (barra inferior no celular), painel em grade com telemetria em fonte mono */
:root{
  --bg:#070b14; --panel:#0e1524; --panel2:#131c30; --line:#1f2b45; --fg:#e6edf8; --muted:#8393b0;
  --accent:#38e1ff; --accent2:#8f7bff; --good:#3ddc97; --warn:#ffb547; --bad:#ff5d73;
  --glow:rgba(56,225,255,.18); --grid:rgba(56,225,255,.045);
  --f-display:"Chakra Petch",system-ui,sans-serif; --f-body:"Manrope",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef3fa; --panel:#ffffff; --panel2:#f4f7fc; --line:#d6dfee; --fg:#0d1628; --muted:#5a6a86;
  --accent:#0090c7; --accent2:#5b46e6; --good:#0c9d63; --warn:#c47a00; --bad:#d6334b;
  --glow:rgba(0,144,199,.14); --grid:rgba(0,120,180,.06); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef3fa; --panel:#ffffff; --panel2:#f4f7fc; --line:#d6dfee; --fg:#0d1628; --muted:#5a6a86;
  --accent:#0090c7; --accent2:#5b46e6; --good:#0c9d63; --warn:#c47a00; --bad:#d6334b;
  --glow:rgba(0,144,199,.14); --grid:rgba(0,120,180,.06); color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(8px);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand i{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));box-shadow:0 0 18px var(--glow);display:block}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:400}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:600}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn:hover{color:var(--fg);background:var(--panel2)}
.navbtn[aria-current="true"]{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent)}
.navbtn[aria-current="true"] svg{color:var(--accent)}
.rail .foot{margin-top:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:8px}
.sync{display:inline-flex;align-items:center;gap:6px}.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok b{background:var(--good);box-shadow:0 0 8px var(--good)}.sync.busy b{background:var(--warn)}
main{padding-block:26px 90px;padding-inline:clamp(16px,3vw,36px);min-width:0;max-width:1240px;width:100%}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
h1{font-family:var(--f-display);font-size:clamp(24px,3.2vw,34px);margin:0;letter-spacing:.02em;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--f-display);font-size:17px;margin:0;letter-spacing:.03em}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101c;border:0;box-shadow:0 6px 24px var(--glow)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 55%),radial-gradient(90% 120% at 100% 100%,color-mix(in srgb,var(--accent2) 16%,transparent),transparent 60%),var(--panel)}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1.05;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.hero-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.kpi .lb{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .vl{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}.wrn{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.row .ic.in{color:var(--good)}.row .ic.out{color:var(--bad)}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted)}
.row .v{font-family:var(--f-mono);font-weight:600;text-align:right;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--glow)}
.catrow{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.catrow .mono{text-align:right}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);margin-bottom:18px;font-size:14px}
.insight{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.insight:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .nm{font-weight:700;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stats .lb{font-size:10.5px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats .vl{font-family:var(--f-mono);font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.ticks{display:flex;gap:3px;flex-wrap:wrap}
.ticks i{width:12px;height:12px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.ticks i.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--glow)}
.ticks i.now{background:var(--accent2);border-color:var(--accent2)}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);width:100%;min-width:0}
label.f input:focus,label.f select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--glow)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px;border:0;background:var(--panel2);cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"].in{background:color-mix(in srgb,var(--good) 20%,var(--panel2));color:var(--good)}
.seg button[aria-pressed="true"].out{background:color-mix(in srgb,var(--bad) 20%,var(--panel2));color:var(--bad)}
.seg button[aria-pressed="true"].n{background:color-mix(in srgb,var(--accent) 20%,var(--panel2));color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(3,6,14,.62);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.sheet .box{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sheet .box .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.out-box{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.out-box .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.verdict{padding:14px 16px;border-radius:12px;border:1px solid var(--line);margin-top:14px;font-size:14.5px}
.verdict.good{border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
.verdict.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.verdict.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.tip{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px;height:34px;display:grid;place-items:center}
.tip h3{margin:0 0 4px;font-size:15.5px}
.tip p{margin:0;color:var(--muted);font-size:14px;max-width:68ch}
.brow{display:grid;grid-template-columns:minmax(0,1.1fr) 78px minmax(0,1.4fr);gap:16px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}
.brow:last-of-type{border-bottom:0}
.brow .t{font-weight:700}.brow .s{font-size:12.5px;color:var(--muted)}
.pct{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);color:var(--muted)}
.pct input{width:56px;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);text-align:right;font-family:var(--f-mono)}
.pct input:focus{border-color:var(--accent);outline:none}
.bbar{position:relative;height:12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.bbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bbar b{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--bad) 0 6px,color-mix(in srgb,var(--bad) 55%,transparent) 6px 12px)}
.bbar.good i{background:var(--good);box-shadow:0 0 10px color-mix(in srgb,var(--good) 50%,transparent)}
.bbar.warn i{background:var(--warn)}
.bbar.bad i{background:var(--bad)}
.bnums{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
@media (max-width:760px){.brow{grid-template-columns:minmax(0,1fr) auto}.brow .bcol{grid-column:1/-1}}
.billd summary{list-style:none;cursor:pointer}.billd summary::-webkit-details-marker{display:none}
.billd[open] summary{border-bottom-style:dashed}
.billd .items{padding:6px 4px 12px 50px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;border-bottom:1px solid var(--line)}
.billd .items div{display:flex;justify-content:space-between;gap:10px}
.row .ic svg{width:18px;height:18px}
.chartwrap{width:100%;overflow-x:auto}
body.locked nav.rail,body.locked .mobilenav{display:none}
body.locked .app{grid-template-columns:1fr}
body.locked main{max-width:none}
.login{min-height:calc(100vh - 120px);display:grid;place-items:center}
.lbox{width:min(420px,100%);padding:28px}
.who{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;background:var(--panel2)}
.who img{width:44px;height:44px;border-radius:50%;flex:none}
.acct{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13.5px;font-weight:600}
.acct img{width:26px;height:26px;border-radius:50%}
.terms{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:14px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dzrow{display:grid;grid-template-columns:minmax(0,1.4fr) 120px 120px minmax(150px,auto);gap:14px;align-items:end;padding:14px 2px;border-bottom:1px solid var(--line)}
.dzrow:last-child{border-bottom:0}
.dzrow .t{font-weight:700}.dzrow .s{font-size:12.5px;color:var(--muted)}
.dzrow.off{opacity:.55}
.dzrow input:disabled{opacity:.6}
.dzact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;padding-bottom:4px}
@media (max-width:760px){.dzrow{grid-template-columns:1fr 1fr}.dzrow>div:first-child,.dzrow .dzact{grid-column:1/-1}.dzrow .dzact{justify-content:flex-start}}
.lesson .n{font-size:12px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px;height:34px;min-width:44px;display:grid;place-items:center}
.lesson.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.autherr{min-height:1.2em;margin:12px 0 0;font-size:13.5px;color:var(--bad)}
.autherr.ok{color:var(--good)}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#04101c;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.reply{margin-top:8px;padding:8px 12px;border-radius:10px;border-left:3px solid var(--accent);background:var(--panel2);font-size:13.5px}
svg text{font-family:var(--f-mono)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ring{width:132px;height:132px;flex:none}
.monthnav{display:flex;align-items:center;gap:8px}
.mobilenav{display:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;box-shadow:0 8px 30px var(--glow)}
@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.rail{display:none}
  .mobilenav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .mobilenav .navbtn{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 8px;flex:1 0 auto;min-width:60px;align-items:center}
  .g2,.out-box{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .catrow{grid-template-columns:86px minmax(0,1fr) 80px}
  .row{grid-template-columns:auto minmax(0,1fr) auto}
  .row .del{grid-column:2/-1;justify-self:end}
}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}.kpi .vl{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .35s ease}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail" aria-label="Seções">
    <div class="brand"><i></i><div>COFRE<small>GESTÃO PESSOAL</small></div></div>
  </nav>
  <main id="main"></main>
</div>
<nav class="mobilenav" id="mnav" aria-label="Seções"></nav>
<div id="sheet"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
const TODAY = new Date();

function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function addM(m,k){let[y,mo]=m.split('-').map(Number);mo+=k;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+String(mo).padStart(2,'0')}
function diffM(a,b){const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)}
const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function mLabel(m,long){const[y,mo]=m.split('-').map(Number);return long?['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mo-1]+' '+y:MN[mo-1]+'/'+String(y).slice(2)}
const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
function R(v){return fmt.format(v||0)}
function R0(v){return fmt0.format(v||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0}
function dur(n){if(n==null)return '—';if(n<=0)return 'já!';const a=Math.floor(n/12),m=n%12;return (a?a+(a>1?' anos':' ano'):'')+(a&&m?' e ':'')+(m?m+(m>1?' meses':' mês'):'')}
function parcelaPrice(total,n,r){r=r/100;if(n<=0)return 0;return r>0?total*r/(1-Math.pow(1+r,-n)):total/n}

/* saldo em conta = saldo inicial + resultado de cada mês desde o mês inicial até o mês m */
function balanceAt(m){
 const ini=S.initial;if(!ini||!ini.month)return null;
 if(diffM(ini.month,m)<0)return num(ini.val);
 let b=num(ini.val);for(let k=ini.month;diffM(k,m)>=0;k=addM(k,1))b+=month(k).saldo;return b;
}
function balanceProj(n){ // saldo previsto daqui a n meses
 const b=balanceAt(CUR);if(b==null)return null;let s=b;for(let k=1;k<=n;k++)s+=projSobra(addM(CUR,k));return s;
}

/* mês em que a compra no cartão vence */
function dueMonthOf(date,card){const m=date.slice(0,7),d=+date.slice(8,10);const closeM=d<card.close?m:addM(m,1);return card.due>card.close?closeM:addM(closeM,1)}
function bills(m){
 const out=[];const cards=S.cards||[];
 cards.forEach(c=>{
  const items=[];
  S.tx.filter(t=>t.type==='out'&&t.cardId===c.id&&t.date&&dueMonthOf(t.date,c)===m).forEach(t=>items.push([t.desc,num(t.val)]));
  S.inst.filter(i=>i.cardId===c.id&&instInMonth(i,m)).forEach(i=>items.push([i.desc+' ('+(diffM(i.first,m)+1)+'/'+i.n+')',instParcel(i)]));
  S.rec.filter(r=>r.type==='out'&&r.cardId===c.id&&recActive(r,m)).forEach(r=>items.push([r.desc,num(r.val)]));
  if(items.length)out.push({key:m+':card:'+c.id,kind:'Fatura do cartão',name:c.name,to:c.name,day:c.due,val:items.reduce((a,x)=>a+x[1],0),items,close:c.close});
 });
 S.rec.filter(r=>r.type==='out'&&!cardById(r.cardId)&&recActive(r,m)).forEach(r=>out.push({key:m+':rec:'+r.id,kind:'Conta fixa',name:r.desc,to:r.to||'',day:r.day||1,val:num(r.val)}));
 S.inst.filter(i=>!cardById(i.cardId)&&instInMonth(i,m)).forEach(i=>out.push({key:m+':inst:'+i.id,kind:'Parcela '+(diffM(i.first,m)+1)+'/'+i.n,name:i.desc,to:i.to||'',day:i.day||10,val:instParcel(i)}));
 out.forEach(b=>b.paid=!!(S.paid||{})[b.key]);
 return out.sort((a,b)=>a.day-b.day);
}
function budPct(c){const b=S.budget||{};return b[c]!=null?num(b[c]):(BUDGET[c]?BUDGET[c][0]:0)}
function spentByCat(m){const c={};
 S.tx.filter(t=>t.type==='out'&&t.date&&t.date.slice(0,7)===m).forEach(t=>c[t.cat]=(c[t.cat]||0)+num(t.val));
 S.rec.filter(r=>r.type==='out'&&recActive(r,m)).forEach(r=>c[r.cat]=(c[r.cat]||0)+num(r.val));
 S.inst.filter(i=>instInMonth(i,m)).forEach(i=>{const k=i.cat||'Outros';c[k]=(c[k]||0)+instParcel(i)});
 return c}

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}

function persist(){
 saveLocal();
 clearTimeout(saveTimer);
 if(!storeRef){setSync('local');return}
 setSync('busy');
 saveTimer=setTimeout(async()=>{
  try{await storeRef.set(JSON.parse(JSON.stringify(S)));setSync('ok')}
  catch(e){setSync('local');toast('Não salvou na nuvem agora. Ficou salvo neste aparelho.')}
 },700);
}

/* ---------- motor de cálculo ---------- */
function instParcel(i){return parcelaPrice(i.total,i.n,i.rate||0)}
function instInMonth(i,m){const k=diffM(i.first,m);return k>=0&&k<i.n}
function instStatus(i){
 const p=instParcel(i);const k=diffM(i.first,CUR);
 const paid=Math.max(0,Math.min(i.n,k+1)); // parcela do mês atual conta como deste mês
 const rem=i.n-paid; return {p,paid,rem,remVal:rem*p,end:addM(i.first,i.n-1),totalPaid:p*i.n,juros:p*i.n-i.total,curK:k};
}
function recActive(r,m){return !r.start||diffM(r.start,m)>=0}
function month(m){
 const inFix=S.rec.filter(r=>r.type==='in'&&recActive(r,m)).reduce((a,r)=>a+num(r.val),0);
 const outFix=S.rec.filter(r=>r.type==='out'&&recActive(r,m)).reduce((a,r)=>a+num(r.val),0);
 const parc=S.inst.filter(i=>instInMonth(i,m)).reduce((a,i)=>a+instParcel(i),0);
 const txs=S.tx.filter(t=>t.date&&t.date.slice(0,7)===m);
 const inVar=txs.filter(t=>t.type==='in').reduce((a,t)=>a+num(t.val),0);
 const outVar=txs.filter(t=>t.type==='out').reduce((a,t)=>a+num(t.val),0);
 const entradas=inFix+inVar, saidas=outFix+parc+outVar;
 return {m,inFix,outFix,parc,inVar,outVar,entradas,saidas,saldo:entradas-saidas};
}
function avgVarOut(){
 const ms=[0,-1,-2].map(k=>addM(CUR,k)).map(month).filter(x=>x.outVar>0);
 return ms.length?ms.reduce((a,x)=>a+x.outVar,0)/ms.length:0;
}
function projSobra(m){const x=month(m);return x.inFix-x.outFix-x.parc-avgVarOut()}
function projection(n){const out=[];for(let k=0;k<n;k++){const m=addM(CUR,k);const x=month(m);out.push({m,parc:x.parc,sobra:x.inFix-x.outFix-x.parc-avgVarOut()})}return out}
function debtFree(){let last=null;S.inst.forEach(i=>{const e=addM(i.first,i.n-1);if(diffM(CUR,e)>=0&&(!last||diffM(last,e)>0))last=e});return last}
function goalMonths(g){
 let saved=num(g.saved);const target=num(g.target),r=num(g.rate)/100;
 if(saved>=target)return 0;
 for(let k=0;k<600;k++){
  const m=addM(CUR,k+1);
  const ap=g.mode==='fixed'?num(g.monthly):Math.max(0,projSobra(m));
  saved=saved*(1+r)+ap;
  if(saved>=target)return k+1;
 }
 return null;
}
function monthsToSave(target,r){ // usando a sobra projetada
 let s=0;r=r/100;for(let k=0;k<600;k++){s=s*(1+r)+Math.max(0,projSobra(addM(CUR,k+1)));if(s>=target)return k+1}return null}

function ring(p,col){

function chart(P){
 const W=620,H=230,pl=56,pr=12,pt=14,pb=28;
 const vals=P.flatMap(p=>[p.sobra,p.parc,0]);
 let max=Math.max(...vals),min=Math.min(...vals);
 const span=(max-min)||1; const step=nice(span/4);
 max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step; if(max===min)max=min+step;
 const y=v=>pt+(max-v)/(max-min)*(H-pt-pb);
 const bw=(W-pl-pr)/P.length;
 let g='';
 for(let v=min;v<=max+1e-6;v+=step){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1" '+(Math.abs(v)<1e-6?'':'stroke-dasharray="3 4"')+'/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+short(v)+'</text>'}
 P.forEach((p,i)=>{
  const x=pl+i*bw+bw*0.2,w=bw*0.6,y0=y(0),y1=y(p.sobra);
  g+='<rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+w+'" height="'+Math.max(1,Math.abs(y1-y0))+'" rx="3" fill="'+(p.sobra>=0?'var(--accent)':'var(--bad)')+'" opacity="'+(i===0?1:.78)+'"><title>'+mLabel(p.m)+': '+R(p.sobra)+'</title></rect>';
  g+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+mLabel(p.m).slice(0,3)+'</text>';
 });
 const pts=P.map((p,i)=>(pl+i*bw+bw/2)+','+y(p.parc)).join(' ');
 g+='<polyline points="'+pts+'" fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-linejoin="round"/>';
 P.forEach((p,i)=>g+='<circle cx="'+(pl+i*bw+bw/2)+'" cy="'+y(p.parc)+'" r="3.2" fill="var(--panel)" stroke="var(--accent2)" stroke-width="2"><title>Parcelas '+mLabel(p.m)+': '+R(p.parc)+'</title></circle>');
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:480px;height:auto" role="img" aria-label="Previsão de sobra e parcelas nos próximos 12 meses">'+g+'</svg>';
}
function nice(x){const e=Math.pow(10,Math.floor(Math.log10(x)));const f=x/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function short(v){const a=Math.abs(v);return (v<0?'-':'')+(a>=1000?(a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':Math.round(a))}
function insights(){

 if(!inc){out.push(['accent','Cadastre sua <b>renda fixa</b> em Fixas para eu calcular quanto sobra e quanto tempo levam suas metas.']);return out}
 const pp=x.parc/inc, fx=x.outFix/inc, sob=projSobra(addM(CUR,1));
 if(pp>0.3)out.push(['bad','Suas parcelas comem <b>'+Math.round(pp*100)+'%</b> da renda. Acima de 30% é zona de risco: evite novas compras parceladas até cair.']);

 if(fx>0.5)out.push(['warn','Contas fixas levam <b>'+Math.round(fx*100)+'%</b> da renda (ideal: até 50%). Revise planos de celular, internet e assinaturas.']);
 if(sob<0)out.push(['bad','Mês que vem a previsão é de <b>falta de '+R0(-sob)+'</b>. Corte gastos variáveis ou adie compras.']);
 else{const pct=sob/inc;out.push([pct>=0.2?'good':'warn','Sobra prevista de <b>'+R0(sob)+'</b> ('+Math.round(pct*100)+'% da renda). '+(pct>=0.2?'Ótimo, direcione para suas metas.':'Meta sugerida: guardar 20% da renda todo mês.')])}
 const df=debtFree();
 if(df){const fut=month(addM(df,1));out.push(['accent','Em <b>'+mLabel(addM(df,1),true)+'</b> você fica livre das parcelas atuais e sua sobra sobe para cerca de <b>'+R0(fut.inFix-fut.outFix-avgVarOut())+'</b>/mês.'])}

 return out;
}

/* Dízimos e ofertas — um cálculo por entrada */
let dizMonth=CUR;
function tithe(){S.tithe=S.tithe||{offer:5};const T=S.tithe;T.rows=T.rows||{};T.pr=T.pr||{};if(T.offer==null)T.offer=5;return T}
function titheRows(m){
 const T=tithe(),ov=T.rows[m]||{},pr=T.pr[m]||{};const src=[];
 S.rec.filter(r=>r.type==='in'&&recActive(r,m)).forEach(r=>src.push({key:'rec-'+r.id,desc:r.desc,cat:r.cat,val:num(r.val),fixa:true}));
 S.tx.filter(t=>t.type==='in'&&t.date&&t.date.slice(0,7)===m).forEach(t=>src.push({key:'tx-'+t.id,desc:t.desc,cat:t.cat,val:num(t.val),fixa:false}));
 return src.map(s=>{const o=ov[s.key]||{};
  const dAuto=s.val*0.10,oAuto=s.val*num(T.offer)/100;
  return {...s,inc:!o.off,d:o.d!=null?num(o.d):dAuto,o:o.o!=null?num(o.o):oAuto,edited:o.d!=null||o.o!=null,paid:pr[s.key]||null};
 });
}
function titheCalc(m){
 const rows=titheRows(m),inc=rows.filter(r=>r.inc);
 const d=inc.reduce((a,r)=>a+r.d,0),o=inc.reduce((a,r)=>a+r.o,0);
 const paid=inc.filter(r=>r.paid).reduce((a,r)=>a+r.paid.d+r.paid.o,0);
 const base=inc.reduce((a,r)=>a+r.val,0);
 return {rows,base,d,o,total:d+o,paidVal:paid,pend:inc.filter(r=>!r.paid).length,nInc:inc.length};
}

async function doAuth(){
 const v=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
 const email=v('aEmail'),pass=(document.getElementById('aPass')||{}).value||'';
 authBusy=true;render();
 try{
  if(authMode==='signup'){
   const name=v('aName'),p2=(document.getElementById('aPass2')||{}).value||'';
   if(!name)throw{msg:'Escreva seu nome.'};
   if(pass!==p2)throw{msg:'As duas senhas estão diferentes.'};
   if(!termsChecked)throw{msg:'Marque "Li e estou ciente do termo de ciência" para criar a conta.'};
   pendingTerms=true;pendingName=name;
   const cred=await AUTH.createUserWithEmailAndPassword(email,pass);
   try{await cred.user.updateProfile({displayName:name})}catch(e){}
   try{await cred.user.sendEmailVerification()}catch(e){}
   ME.name=name;
  }else if(authMode==='reset'){
   await AUTH.sendPasswordResetEmail(email);
   authBusy=false;authMode='login';render();setAuthErr('Link enviado para '+email+'. Confira também a caixa de spam.');return;
  }else{
   await AUTH.signInWithEmailAndPassword(email,pass);
  }
  authBusy=false;
 }catch(e){
  authBusy=false;pendingTerms=false;pendingName='';
  const keep={};['aName','aEmail'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});
  render();for(const k in keep){const el=document.getElementById(k);if(el)el.value=keep[k]}
  setAuthErr(e&&e.msg?e.msg:authErr(e));
 }
}

function simCalc(){
 const g=id=>num((document.getElementById(id)||{}).value);
 if(!document.getElementById('sOut'))return;
 const price=g('sPrice'),disc=g('sDisc'),down=g('sDown'),n=Math.max(1,Math.round(g('sN'))),rate=g('sRate'),extra=g('sExtra');
 const fin=Math.max(0,price-down),p=parcelaPrice(fin,n,rate),total=down+p*n,vista=price*(1-disc/100),diff=total-vista;
 const x=month(CUR),inc=x.inFix||x.entradas,sob=projSobra(addM(CUR,1));
 const after=sob-p-extra,pct=inc?(p+extra)/inc:0;
 const mVista=monthsToSave(Math.max(0,vista-down),0.8);
 document.getElementById('sOut').innerHTML=
  k2('Parcela',R(p),n+'x · financiando '+R0(fin))+k2('Total pago',R0(total),'à vista sairia '+R0(vista))+
  k2('Custo de parcelar',R0(diff),diff>0?Math.round(diff/vista*100)+'% a mais':'sem custo extra',diff>vista*0.25?'neg':diff>0?'wrn':'pos')+
  k2('Peso na renda',Math.round(pct*100)+'%','parcela + custos extras',pct>0.3?'neg':pct>0.15?'wrn':'pos')+
  k2('Sobra depois',R0(after),'por mês',after<0?'neg':'pos')+
  k2('Juntar e pagar à vista',mVista==null?'—':dur(mVista),mVista==null?'sem sobra hoje':'guardando a sobra, rendendo 0,8% a.m.','acc');
 let cls,msg;
 if(after<0||pct>0.35){cls='bad';msg='<b>Não recomendado agora.</b> Essa compra deixa seu mês no vermelho ou compromete mais de 35% da renda. Aumente a entrada, escolha algo mais barato ou junte antes.'}
 else if(pct>0.2||diff>vista*0.3){cls='warn';msg='<b>Dá, mas pesa.</b> '+(diff>vista*0.3?'Você paga '+R0(diff)+' só de juros. ':'')+(mVista!=null&&mVista<=n/2?'Juntando a sobra você compra à vista em '+dur(mVista)+', bem antes de terminar as parcelas. ':'')+'Negocie juros menores ou uma entrada maior.'}
 else{cls='good';msg='<b>Cabe no orçamento.</b> Mantém sua sobra positiva e o peso na renda fica saudável. '+(diff>0?'Mesmo assim, compare: à vista você economiza '+R0(diff)+'.':'')}
 document.getElementById('sVerdict').innerHTML='<div class="verdict '+cls+'">'+msg+'</div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn sm" data-act="simToInst">Lançar como compra parcelada</button></div>';
}
function k2(l,v,s,c){return '<div class="kpi"><div class="lb">'+l+'</div><div class="vl '+(c==='acc'?'':c||'')+'" '+(c==='acc'?'style="color:var(--accent)"':'')+'>'+v+'</div><div class="sub">'+s+'</div></div>'}

function cardField(sel,label){
 const cs=S.cards||[];
 return '<label class="f">'+(label||'Cartão de crédito')+'<select name="card"><option value="">'+(cs.length?'Nenhum (não é no cartão)':'Nenhum cartão cadastrado')+'</option>'+cs.map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+' · vence dia '+c.due+'</option>').join('')+'</select></label>';
}
function formCard(c){
 c=c||{name:'',close:'',due:''};
 openSheet(c.id?'Editar cartão':'Novo cartão','<div class="form">'+
  '<label class="f full">Nome do cartão / banco<input name="name" value="'+esc(c.name)+'" placeholder="Ex.: Nubank, Itaú Visa"></label>'+
  '<label class="f">Dia que a fatura fecha<input name="close" type="number" inputmode="numeric" min="1" max="31" value="'+c.close+'"></label>'+
  '<label class="f">Dia de pagamento (vencimento)<input name="due" type="number" inputmode="numeric" min="1" max="31" value="'+c.due+'"></label>'+
  '<p class="muted full" style="margin:0;font-size:12.5px">Compras feitas a partir do dia de fechamento entram na fatura do mês seguinte.</p></div>',f=>{
  if(!need(f,['name','close','due']))return false;
  const d=v=>Math.min(31,Math.max(1,Math.round(num(v))));
  upsert('cards',{id:c.id||uid(),name:f.name.value.trim(),close:d(f.close.value),due:d(f.due.value)});commit('Cartão salvo');});
}
function formInit(){
 const i=S.initial||{val:'',month:CUR};
 openSheet('Saldo inicial','<div class="form">'+
  '<label class="f">Valor em conta (R$)<input name="val" type="number" inputmode="decimal" step="0.01" value="'+(i.val===''?'':i.val)+'" placeholder="Ex.: 2500"></label>'+
  '<label class="f">No início de qual mês<input name="month" type="month" value="'+i.month+'"></label>'+
  '<p class="muted full" style="margin:0;font-size:12.5px">Some o que você tem em todas as contas e na carteira. Pode ser negativo se a conta estiver no cheque especial. A partir desse mês, o app soma entradas e tira saídas para mostrar o saldo atual.</p></div>',f=>{
  if(f.val.value===''){f.val.focus();toast('Preencha o valor');return false}
  S.initial={val:num(f.val.value),month:f.month.value||CUR};S.demo=false;commit('Saldo inicial salvo');});
}
function formGoal(g){
 g=g||{name:'',target:'',saved:0,mode:'auto',monthly:300,rate:0.8};
 openSheet(g.id?'Editar meta':'Nova meta','<div class="form">'+
  '<label class="f full">Nome da meta<input name="name" value="'+esc(g.name)+'" placeholder="Ex.: Reserva de emergência"></label>'+
  '<label class="f">Valor da meta (R$)<input name="target" type="number" inputmode="decimal" min="0" step="100" value="'+(g.target||'')+'"></label>'+
  '<label class="f">Já tenho guardado (R$)<input name="saved" type="number" inputmode="decimal" min="0" step="0.01" value="'+(g.saved||0)+'"></label>'+
  '<div class="full"><div class="seg" data-mode="1" data-val="'+g.mode+'"><button type="button" class="n" data-v="auto" aria-pressed="'+(g.mode==='auto')+'">Usar a sobra do mês</button><button type="button" class="n" data-v="fixed" aria-pressed="'+(g.mode==='fixed')+'">Valor fixo por mês</button></div></div>'+
  '<label class="f" id="monthlyWrap" '+(g.mode==='fixed'?'':'hidden')+'>Guardar por mês (R$)<input name="monthly" type="number" inputmode="decimal" min="0" step="50" value="'+(g.monthly||0)+'"></label>'+
  '<label class="f">Rendimento (% ao mês)<input name="rate" type="number" inputmode="decimal" min="0" step="0.1" value="'+(g.rate||0)+'"></label></div>',f=>{
  if(!need(f,['name','target']))return false;
  upsert('goals',{id:g.id||uid(),name:f.name.value.trim(),target:num(f.target.value),saved:num(f.saved.value),mode:f.querySelector('.seg').dataset.val,monthly:num(f.monthly.value),rate:num(f.rate.value)});commit('Meta salva');});
}
function formDep(g){
 openSheet('Guardei dinheiro · '+g.name,'<div class="form"><label class="f full">Valor guardado agora (R$)<input name="val" type="number" inputmode="decimal" min="0" step="0.01"></label></div>',f=>{
  if(!need(f,['val']))return false;g.saved=num(g.saved)+num(f.val.value);commit('Adicionado à meta');});
}
function upsert(col,o){S.demo=false;const a=S[col];const k=a.findIndex(x=>x.id===o.id);if(k>=0)a[k]=o;else a.push(o)}
function find(col,id){return S[col].find(x=>x.id===id)}

/* ---------- eventos ---------- */
let delArm=null;
document.addEventListener('click',e=>{
 const go=e.target.closest('[data-go]');if(go){view=go.dataset.go;render();window.scrollTo(0,0);return}
 const tp=e.target.closest('[data-tip]');if(tp){tipTab=tp.dataset.tip;render();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id;
 if(a==='addTx')formTx();
 else if(a==='editTx')formTx({...find('tx',id)});
 else if(a==='addRec')formRec();
 else if(a==='editRec')formRec({...find('rec',id)});
 else if(a==='addInst')formInst();
 else if(a==='editInst')formInst({...find('inst',id)});
 else if(a==='addGoal')formGoal();
 else if(a==='editGoal')formGoal({...find('goals',id)});
 else if(a==='depGoal')formDep(find('goals',id));
 else if(a==='pPrev'){pagarMonth=addM(pagarMonth,-1);render()}
 else if(a==='pNext'){pagarMonth=addM(pagarMonth,1);render()}
 else if(a==='togPaid'){e.preventDefault();const k=b.dataset.key;if(S.paid[k])delete S.paid[k];else S.paid[k]=true;S.demo=false;commit(S.paid[k]?'Marcado como pago':'Pagamento desfeito')}
 else if(a==='addCard')formCard();
 else if(a==='editInit')formInit();
 else if(a==='editCard')formCard({...find('cards',id)});
 else if(a==='oPrev'){orcMonth=addM(orcMonth,-1);render()}
 else if(a==='oNext'){orcMonth=addM(orcMonth,1);render()}
 else if(a==='togFam'){S.budgetFamily=S.budgetFamily===false;commit(S.budgetFamily?'Renda da família somada':'Usando só o seu salário')}
 else if(a==='resetBud'){S.budget={};commit('Percentuais padrão restaurados')}
 else if(a==='logout'){closeSheetQuiet();window.scrollTo(0,0);if(AUTH)AUTH.signOut();else{locked=true;render()}}
 else if(a==='authMode'){authMode=b.dataset.m;render()}
 else if(a==='resendVerify'){const u=AUTH&&AUTH.currentUser;if(u)u.sendEmailVerification().then(()=>toast('E-mail enviado para '+u.email),()=>toast('Não consegui enviar agora. Tente mais tarde.'))}
 else if(a==='installApp'){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;closeSheetQuiet()})}}
 else if(a==='share')showShare();
 else if(a==='shareTab'){shareTab=b.dataset.v;closeSheetQuiet();showShare()}
 else if(a==='copyLink'){const i=document.getElementById('appLink');const ok=()=>toast('Link copiado');try{navigator.clipboard.writeText(APP_URL).then(ok,()=>{i.select();toast('Link selecionado: copie com Ctrl+C')})}catch(err){i.select();toast('Link selecionado: copie com Ctrl+C')}}
 else if(a==='dPrev'){dizMonth=addM(dizMonth,-1);render()}
 else if(a==='dNext'){dizMonth=addM(dizMonth,1);render()}
 else if(a==='dizOffer'){tithe().offer=num(b.dataset.v);S.demo=false;commit('Oferta: '+b.dataset.v+'%')}
 else if(a==='dzPay'){const r=titheRows(dizMonth).find(x=>x.key===b.dataset.k);if(r){dzPayRow(dizMonth,r);S.demo=false;commit('Devolvido: '+R(r.d+r.o)+' ('+r.desc+')')}}
 else if(a==='dzPayAll'){const rs=titheRows(dizMonth).filter(x=>x.inc&&!x.paid);rs.forEach(r=>dzPayRow(dizMonth,r));S.demo=false;commit(rs.length+' entrada'+(rs.length>1?'s':'')+' marcada'+(rs.length>1?'s':'')+' como devolvida'+(rs.length>1?'s':''))}
 else if(a==='dzUndo'){const T=tithe(),p=(T.pr[dizMonth]||{})[b.dataset.k];if(p){S.tx=S.tx.filter(t=>!(p.tx||[]).includes(t.id));delete T.pr[dizMonth][b.dataset.k];commit('Registro desfeito')}}
 else if(a==='dzReset'){dzSetOv(dizMonth,b.dataset.k,{d:undefined,o:undefined});commit('Valores automáticos restaurados')}
 else if(a==='dizTab'){dizTab=b.dataset.v;render();window.scrollTo(0,0)}
 else if(a==='studyDone'){S.study=S.study||{};const i=b.dataset.i;if(S.study[i])delete S.study[i];else S.study[i]=todayISO();S.demo=false;commit(S.study[i]?'Lição marcada como estudada':'')}
 else if(a==='termo'){const c=document.getElementById('termsChk');if(c)termsChecked=c.checked;showTermo()}
 else if(a==='admUser'){const s=b.dataset.s;if(s==='removed'&&delArm!==b){delArm=b;b.textContent='Confirmar exclusão';setTimeout(()=>{if(delArm===b){delArm=null;b.textContent='Excluir'}},3500);return}delArm=null;admUser(b.dataset.u,s)}
 else if(a==='admFilter'){admFilter=b.dataset.f;render()}
 else if(a==='admSet'){const s=b.dataset.s;admWrite(b.dataset.u,items=>{const i=items.find(x=>x.id===id);if(i)i.status=s});toast('Status: '+s)}
 else if(a==='admDel'){if(delArm!==b){delArm=b;b.textContent='Confirmar';setTimeout(()=>{if(delArm===b){delArm=null;b.textContent='Excluir'}},3000);return}delArm=null;admWrite(b.dataset.u,items=>{const k=items.findIndex(x=>x.id===id);if(k>=0)items.splice(k,1)});toast('Sugestão excluída')}
 else if(a==='admReply'){const u=b.dataset.u,it=(ALL[u]||[]).find(x=>x.id===id)||{};
  openSheet('Responder sugestão','<div class="form"><p class="full muted" style="margin:0;white-space:pre-wrap">'+esc(it.text)+'</p><label class="f full">Sua resposta (o usuário vê na tela dele)<input name="r" value="'+esc(it.reply||'')+'"></label></div>',f=>{const r=f.r.value.trim();admWrite(u,items=>{const i=items.find(x=>x.id===id);if(i){if(r)i.reply=r;else delete i.reply;if(r&&i.status==='Nova')i.status='Em análise'}});toast('Resposta salva')})}
 else if(a==='copyIdeas'){const src=ME.owner&&Object.keys(ALL).length?Object.entries(ALL).flatMap(([u,l])=>l.map(i=>({...i,who:u===ME.id?'Você':(NAMES[u]||'Usuário')}))):getIdeas();
  const txt=src.filter(i=>i.status!=='Feita').map((i,k)=>(k+1)+'. ['+i.kind+']'+(i.who?' ('+i.who+')':'')+' '+i.text).join('\n')||'Nenhuma sugestão em aberto.';
  const done=()=>toast('Copiado! Cole no chat do Claude.');
  try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt))}catch(err){fallbackCopy(txt)}}
 else if(a==='mPrev'){lancMonth=addM(lancMonth,-1);render()}
 else if(a==='mNext'){lancMonth=addM(lancMonth,1);render()}
 else if(a==='clearDemo'){if(delArm!==b){delArm=b;b.textContent='Tem certeza? Toque de novo';setTimeout(()=>{if(delArm===b){delArm=null;b.textContent='Apagar exemplos e começar'}},3500);return}S=blank();delArm=null;commit('Pronto! Comece cadastrando sua renda em Fixas.');view='fixas';render()}
 else if(a==='del'){if(delArm!==b){delArm=b;b.textContent='Confirmar';setTimeout(()=>{if(delArm===b){delArm=null;b.textContent='Excluir'}},3000);return}delArm=null;if(b.dataset.col==='ideas'){saveIdeas(getIdeas().filter(x=>x.id!==id));toast('Excluído');return}S.demo=false;S[b.dataset.col]=S[b.dataset.col].filter(x=>x.id!==id);commit('Excluído')}
 else if(a==='simToInst'){const g=k=>num(document.getElementById(k).value);formInst({desc:document.getElementById('sDesc').value,cat:'Transporte',total:Math.max(0,g('sPrice')-g('sDown')),n:Math.max(1,Math.round(g('sN'))),rate:g('sRate'),first:addM(CUR,1),day:10,pay:'Boleto'})}
});
document.addEventListener('input',e=>{
 if(e.target.id==='offRange'){const l=document.getElementById('offLbl');if(l)l.textContent=String(e.target.value).replace('.',',')+'%'}
 if(e.target.closest('#main')&&view==='sim')simCalc();
 if(e.target.id==='qcVal'||e.target.id==='qcRate')qc();
});
document.addEventListener('change',e=>{
 if(e.target.id==='termsChk'){termsChecked=e.target.checked;return}
 if(e.target.dataset&&e.target.dataset.dz){const v=Math.max(0,num(e.target.value));dzSetOv(dizMonth,e.target.dataset.dz,{[e.target.dataset.fld]:v});commit((e.target.dataset.fld==='d'?'Dízimo':'Oferta')+' ajustado');return}
 if(e.target.dataset&&e.target.dataset.dzinc){dzSetOv(dizMonth,e.target.dataset.dzinc,{off:e.target.checked?undefined:true});commit(e.target.checked?'Entrada incluída':'Entrada fora do dízimo');return}
 if(e.target.id==='offRange'){tithe().offer=num(e.target.value);S.demo=false;commit('Oferta: '+String(e.target.value).replace('.',',')+'%');return}
 const c=e.target.dataset&&e.target.dataset.bud;if(!c)return;
 S.budget=S.budget||{};S.budget[c]=Math.max(0,Math.min(100,num(e.target.value)));S.demo=false;commit('Percentual de '+c+' atualizado');
});
document.addEventListener('submit',async e=>{
 if(e.target.id==='authForm'){e.preventDefault();if(!authBusy)doAuth();return}
 if(e.target.id==='localForm'){e.preventDefault();locked=false;render();return}
 if(e.target.id==='termsForm'){e.preventDefault();const c=document.getElementById('termsChk');if(!c||!c.checked){toast('Marque "Li e estou ciente" para continuar');return}S.termsAt=todayISO();commit();return}
 if(e.target.id!=='ideaForm')return;e.preventDefault();
 const t=document.getElementById('ideaText').value.trim();if(!t){toast('Escreva a sugestão primeiro.');return}
 saveIdeas(getIdeas().concat([{id:uid(),kind:document.getElementById('ideaKind').value,text:t,status:'Nova',date:CUR+'-'+String(TODAY.getDate()).padStart(2,'0')}]));toast(ideasRef?'Sugestão enviada ao desenvolvedor':'Sugestão registrada');
});
function closeSheetQuiet(){document.getElementById('sheet').innerHTML=''}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:16px;right:16px;bottom:100px;height:140px;z-index:70;background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:10px;padding:10px';document.body.appendChild(ta);ta.select();toast('Selecionei o texto: copie com Ctrl+C');ta.addEventListener('blur',()=>ta.remove())}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#sheet .sheet'))closeSheet()});
let tt;function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;clearTimeout(tt);tt=setTimeout(()=>t.remove(),2600)}
const _render=render;render=function(){_render();qc()};
boot();
})();
</script>
</body>
</html>
